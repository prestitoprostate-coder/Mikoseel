<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikoseel — Admin Validation Solde</title>
<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0c001a,#4c1d95);
  color: #fff;
  padding: 20px;
}
h1{text-align:center;margin-bottom:30px;}
form, .balance-box{
  max-width:720px;
  margin:0 auto 20px auto;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.field{margin-bottom:12px;}
label{display:block;margin-bottom:6px;font-weight:600;}
input,select,button{
  width:100%;padding:10px;border:none;border-radius:6px;
  background:rgba(255,255,255,0.08);color:#fff;
}
button{background:linear-gradient(90deg,#6d28d9,#ec4899);font-weight:bold;cursor:pointer;}
.balance{font-size:24px;font-weight:bold;text-align:center;margin-top:12px;}
.muted{font-size:14px;color:#d6c6ff;margin-top:6px;}
</style>
</head>
<body>

<h1>💰 Admin — Valider le solde</h1>

<!-- Sélection de l’utilisateur -->
<form id="userForm">
  <div class="field">
    <label for="user_email">Email utilisateur</label>
    <input type="email" id="user_email" placeholder="email@exemple.com" required>
  </div>
  <button type="submit">Charger le compte</button>
</form>

<!-- Solde et validation pack -->
<div class="balance-box" id="balanceBox" style="display:none;">
  <h2>Solde actuel :</h2>
  <div class="balance" id="balanceDisplay">0 FCFA</div>

  <div class="field">
    <label for="packSelect">Pack validé</label>
    <select id="packSelect">
      <option value="">-- Sélectionner un pack --</option>
      <option value="Bronze">Pack Bronze (2 000 – 5 000 FCFA, +250 / 12h)</option>
      <option value="Silver">Pack Silver (5 000 – 10 000 FCFA, +900 / 12h)</option>
      <option value="Gold">Pack Gold (10 000 – 50 000 FCFA, +2000 / 12h)</option>
      <option value="Diamond">Pack Diamond (50 000 – 1 500 000 FCFA, +12000 / 12h)</option>
    </select>
  </div>
  <button id="validatePack">Valider le pack</button>
  <p class="muted">Le gain sera ajouté automatiquement toutes les 12h. Copiez le message de transaction pour votre référence.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

// Config Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
    authDomain: "valide-28624.firebaseapp.com",
    projectId: "valide-28624",
    storageBucket: "valide-28624.appspot.com",
    messagingSenderId: "483447990733",
    appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const userForm = document.getElementById('userForm');
const balanceBox = document.getElementById('balanceBox');
const balanceDisplay = document.getElementById('balanceDisplay');
const packSelect = document.getElementById('packSelect');
const validatePackBtn = document.getElementById('validatePack');

let currentUserEmail = '';
let balance = 0;
let gainPer12h = 0;
let intervalId = null;

const packs = {
  "Bronze": 250,
  "Silver": 900,
  "Gold": 2000,
  "Diamond": 12000
};

// Charger le compte utilisateur
userForm.addEventListener('submit', async e=>{
  e.preventDefault();
  currentUserEmail = document.getElementById('user_email').value.trim();
  if(!currentUserEmail) return alert("Email requis");

  const userRef = doc(db,'users',currentUserEmail);
  const snap = await getDoc(userRef);
  
  if(!snap.exists()){
    alert("Erreur : cet utilisateur n'existe pas dans Firestore !");
    balanceBox.style.display = 'none';
    return;
  }

  balance = snap.data().balance || 0;
  balanceDisplay.textContent = balance.toLocaleString() + " FCFA";
  balanceBox.style.display='block';
});

// Valider le pack et lancer gain automatique
validatePackBtn.addEventListener('click', async e=>{
  e.preventDefault();
  if(!currentUserEmail) return alert("Vous devez d'abord sélectionner un utilisateur.");
  
  const pack = packSelect.value;
  if(!pack) return alert("Choisissez un pack");

  gainPer12h = packs[pack];
  const userRef = doc(db,'users',currentUserEmail);

  // Ajouter le pack et montant initial au solde
  balance += gainPer12h;
  balanceDisplay.textContent = balance.toLocaleString() + " FCFA";

  await updateDoc(userRef,{
    pack: pack,
    balance: balance,
    history: arrayUnion({type:'Validation pack',pack:pack,gain:gainPer12h,date:new Date().toLocaleString()})
  });

  alert(`Pack ${pack} validé ! Gains automatiques programmés.`);

  // Supprimer ancien intervalle
  if(intervalId) clearInterval(intervalId);

  // Incrément automatique toutes les 12h (43200000 ms)
  intervalId = setInterval(async ()=>{
    balance += gainPer12h;
    balanceDisplay.textContent = balance.toLocaleString() + " FCFA";
    await updateDoc(userRef,{
      balance: balance,
      history: arrayUnion({type:'Gain automatique',pack:pack,gain:gainPer12h,date:new Date().toLocaleString()})
    });
  }, 43200000);

  // Pour test rapide, tu peux remplacer 43200000 par 12000 (12 sec)
});
</script>
</body>
</html>
