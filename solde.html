<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier Solde - Mikoseel</title>
<style>
body{font-family:"Poppins",sans-serif; background:#12002a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0;}
.container{background:rgba(40,0,60,0.8); padding:30px; border-radius:12px; box-shadow:0 0 20px rgba(236,72,153,0.5);}
input, button{padding:10px 15px; border:none; border-radius:8px; margin:5px 0; font-size:16px;}
button{background:#ec4899; color:#fff; cursor:pointer;}
button:hover{background:#d53f8c;}
label{display:block; margin-top:10px;}
</style>
</head>
<body>
<div class="container">
  <h2>Modifier Solde Utilisateur</h2>
  <p id="userEmail"></p>
  <label>Montant:</label>
  <input type="number" id="amount" placeholder="Ex: 5000" />
  <label>Type:</label>
  <select id="type">
    <option value="add">Ajouter</option>
    <option value="remove">Retirer</option>
  </select>
  <button id="submitBtn">Valider</button>
  <p id="status"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.appspot.com",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const userEmail = urlParams.get('email');
document.getElementById('userEmail').textContent = "Utilisateur: " + (userEmail || "inconnu");

document.getElementById('submitBtn').onclick = async () => {
  const amount = parseFloat(document.getElementById('amount').value);
  const type = document.getElementById('type').value;
  const status = document.getElementById('status');

  if(!userEmail){ status.textContent = "Email utilisateur manquant!"; return; }
  if(isNaN(amount) || amount <= 0){ status.textContent = "Montant invalide!"; return; }

  const userRef = doc(db, 'users', userEmail);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    await setDoc(userRef, { balance: 0, history: [] });
  }

  const data = (await getDoc(userRef)).data();
  let newBalance = data.balance || 0;

  if(type === "add") newBalance += amount;
  else newBalance -= amount;

  if(newBalance < 0){ status.textContent = "Solde insuffisant!"; return; }

  await updateDoc(userRef, {
    balance: newBalance,
    history: arrayUnion({
      date: new Date().toLocaleString(),
      type: type === "add" ? "Dépôt" : "Retrait",
      gain: amount
    })
  });

  status.textContent = `Solde mis à jour: ${newBalance.toLocaleString()} FCFA`;
  document.getElementById('amount').value = "";
};
</script>
</body>
</html>
