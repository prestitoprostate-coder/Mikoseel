<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikoseel - Gestion du Solde</title>
<style>
body {
  font-family: "Poppins", sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(120deg, #0c001a, #4c1d95, #6d28d9);
  color: #fff;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card {
  background: rgba(20, 0, 40, 0.7);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
  width: 90%;
  max-width: 400px;
  text-align: center;
}
input, select, button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  font-size: 16px;
}
button {
  background: #ec4899;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #a855f7;
}
#balanceBox { display: none; }
</style>
</head>
<body>

<div class="card">
  <h2>Gestion du solde utilisateur</h2>

  <form id="userForm">
    <input type="email" id="email" placeholder="Entrez l'email de l'utilisateur" required>
    <button type="submit">Vérifier le compte</button>
  </form>

  <div id="balanceBox">
    <p><strong>Utilisateur :</strong> <span id="userEmail"></span></p>
    <p><strong>Solde actuel :</strong> <span id="balanceDisplay">0 FCFA</span></p>

    <select id="actionSelect">
      <option value="">-- Choisissez une action --</option>
      <option value="add">Augmenter le solde</option>
      <option value="reduce">Réduire le solde</option>
    </select>

    <select id="packSelect">
      <option value="">-- Choisissez un pack (si ajout) --</option>
      <option value="Bronze">Pack Bronze (+250)</option>
      <option value="Silver">Pack Silver (+900)</option>
      <option value="Gold">Pack Gold (+2000)</option>
      <option value="Diamond">Pack Diamond (+12000)</option>
    </select>

    <input type="number" id="customAmount" placeholder="Montant personnalisé (optionnel)">
    <button id="validateBtn">Valider l'opération</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.appspot.com",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const userForm = document.getElementById("userForm");
const emailInput = document.getElementById("email");
const balanceBox = document.getElementById("balanceBox");
const userEmailEl = document.getElementById("userEmail");
const balanceDisplay = document.getElementById("balanceDisplay");
const actionSelect = document.getElementById("actionSelect");
const packSelect = document.getElementById("packSelect");
const customAmountInput = document.getElementById("customAmount");
const validateBtn = document.getElementById("validateBtn");

let currentUserEmail = "";
let currentBalance = 0;

const packs = { Bronze: 250, Silver: 900, Gold: 2000, Diamond: 12000 };

// Vérification utilisateur
userForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim().toLowerCase();
  const userRef = doc(db, "users", email);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    alert("⚠️ Cet utilisateur n'existe pas dans la base de données !");
    return;
  }

  currentUserEmail = email;
  currentBalance = snap.data().balance || 0;
  balanceDisplay.textContent = currentBalance.toLocaleString() + " FCFA";
  userEmailEl.textContent = currentUserEmail;

  userForm.style.display = "none";
  balanceBox.style.display = "block";
});

// Validation d'une opération (ajout ou réduction)
validateBtn.addEventListener("click", async () => {
  if (!currentUserEmail) return alert("Aucun utilisateur sélectionné.");

  const action = actionSelect.value;
  const pack = packSelect.value;
  const customAmount = Number(customAmountInput.value) || 0;

  if (!action) return alert("Choisissez une action !");
  if (action === "add" && !pack && !customAmount)
    return alert("Choisissez un pack ou entrez un montant à ajouter !");
  if (action === "reduce" && !customAmount)
    return alert("Entrez le montant à réduire !");

  const userRef = doc(db, "users", currentUserEmail);
  const snap = await getDoc(userRef);
  if (!snap.exists()) return alert("Utilisateur introuvable !");

  let gain = 0;
  if (action === "add") gain = packs[pack] || customAmount;
  else if (action === "reduce") gain = -Math.abs(customAmount);

  const newBalance = (snap.data().balance || 0) + gain;

  if (newBalance < 0) return alert("❌ Impossible : le solde ne peut pas être négatif.");

  await updateDoc(userRef, {
    balance: newBalance,
    history: arrayUnion({
      date: new Date().toLocaleString(),
      type: action === "add" ? "Ajout" : "Réduction",
      pack: pack || "Manuel",
      gain: gain
    })
  });

  balanceDisplay.textContent = newBalance.toLocaleString() + " FCFA";
  alert("✅ Solde mis à jour avec succès !");
});
</script>

</body>
</html>
