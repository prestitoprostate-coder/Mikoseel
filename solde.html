<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikoseel - Dashboard</title>
<style>
body{font-family:"Poppins",sans-serif;background:#0c001a;color:#fff;margin:0;padding:0;}
header{background:linear-gradient(90deg,#6d28d9,#ec4899);padding:15px;text-align:center;font-size:24px;}
.container{max-width:800px;margin:30px auto;padding:20px;background:rgba(20,0,40,0.8);border-radius:12px;}
.card{background:rgba(255,255,255,0.05);padding:15px;border-radius:10px;margin-bottom:15px;}
h2{margin-top:0;color:#a855f7;}
ul{list-style:none;padding:0;}
li{padding:5px 0;border-bottom:1px solid rgba(236,72,153,0.2);}
</style>
</head>
<body>

<header>Mikoseel Dashboard</header>

<div class="container">
  <div class="card">
    <h2>Solde</h2>
    <p id="balance">0 FCFA</p>
  </div>

  <div class="card">
    <h2>Historique des transactions</h2>
    <ul id="history"><li>Aucune transaction pour le moment</li></ul>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

// Config Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
    authDomain: "valide-28624.firebaseapp.com",
    projectId: "valide-28624",
    storageBucket: "valide-28624.appspot.com",
    messagingSenderId: "483447990733",
    appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Récupération email depuis l'URL
const urlParams = new URLSearchParams(window.location.search);
const userEmail = urlParams.get('email');
if(!userEmail){
    alert("Aucun utilisateur spécifié !");
    window.location.href = "login.html"; // retour au login si email absent
}

const balanceEl = document.getElementById('balance');
const historyEl = document.getElementById('history');

const userRef = doc(db, 'users', userEmail);
onSnapshot(userRef, snap => {
    if(snap.exists()){
        const data = snap.data();
        balanceEl.textContent = (data.balance || 0).toLocaleString() + " FCFA";
        const hist = data.history || [];
        historyEl.innerHTML = hist.length 
            ? hist.map(h => `<li>${h.date} - ${h.type} ${h.pack ? '- '+h.pack : ''} ${h.gain ? '+ '+h.gain.toLocaleString()+' FCFA' : ''}</li>`).join('')
            : '<li>Aucune transaction pour le moment</li>';
    } else {
        alert("Cet utilisateur n'existe pas !");
        window.location.href = "login.html";
    }
});
</script>

</body>
</html>
