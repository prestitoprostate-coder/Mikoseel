<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dépôt & Retrait - Mikosell Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body {margin:0; font-family:'Roboto',sans-serif; background:#0d0d1f; color:#fff;}
#bubbles {position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;}
.bubble {position: absolute; border-radius: 50%; opacity: 0.3; background: radial-gradient(circle, #ff7f50 0%, transparent 70%); animation: float linear infinite;}
@keyframes float {0% {transform: translateY(100vh) rotate(0deg); opacity:0;} 50% {opacity:0.5;} 100% {transform: translateY(-100px) rotate(360deg); opacity:0;}}
.container {max-width:450px; margin:40px auto; background:#1a1a2f; border-radius:20px; padding:20px;}
.tabs {display:flex; margin-bottom:20px;}
.tab {flex:1; text-align:center; padding:10px; cursor:pointer; border-radius:10px; background:#12122a; margin-right:5px;}
.tab.active {background:#ff7f50; font-weight:bold; color:#0d0d1f;}
.tab-content {display:none;}
.tab-content.active {display:block;}
input, select, textarea {width:100%; padding:12px; margin-bottom:12px; border-radius:12px; border:none; background:#12122a; color:#fff; font-size:16px;}
textarea {resize:none;}
button {width:100%; padding:12px; border:none; border-radius:12px; background:#ff7f50; color:#0d0d1f; font-weight:700; cursor:pointer; font-size:16px; transition:0.3s; margin-bottom:10px;}
button:hover {transform:scale(1.05);}
#error, #success, #ussd, #errorRetrait, #successRetrait {text-align:center; margin-bottom:10px;}
#error, #errorRetrait {color:#ff4d4d;}
#success, #successRetrait {color:#00ff99;}
#ussd {color:#ffcc00;}
</style>
</head>
<body>
<div id="bubbles"></div>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="openTab('deposit')">Dépôt</div>
    <div class="tab" onclick="openTab('withdraw')">Retrait</div>
  </div>

  <!-- Dépôt -->
  <div class="tab-content active" id="deposit">
    <div id="error"></div>
    <div id="success"></div>
    <div id="ussd"></div>
    <input type="number" id="amount" placeholder="Montant (FCFA)">
    <input type="text" id="phone" placeholder="Numéro du déposant">
    <select id="network">
      <option value="">Choisir réseau</option>
      <option value="mtn">MTN Money</option>
      <option value="moov">Moov</option>
      <option value="celtiis">Celtiis</option>
      <option value="orange">Orange Money</option>
    </select>
    <textarea id="message" placeholder="Collez ici le message reçu après dépôt" rows="4"></textarea>
    <button id="generateBtn">Générer le code USSD</button>
    <button id="depositBtn">Valider le dépôt</button>
  </div>

  <!-- Retrait -->
  <div class="tab-content" id="withdraw">
    <div id="errorRetrait"></div>
    <div id="successRetrait"></div>
    <input type="number" id="withdrawAmount" placeholder="Montant à retirer (FCFA)">
    <input type="text" id="withdrawPhone" placeholder="Numéro du bénéficiaire">
    <button id="withdrawBtn">Envoyer la demande de retrait</button>
  </div>
</div>

<script type="module">
// ======= Firebase Imports =======
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-auth.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

// ======= Config Firebase =======
const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  databaseURL: "https://valide-28624-default-rtdb.firebaseio.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.appspot.com",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:ee5b850dc31cbb8776bc84"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;

// ======= Références boutons =======
const depositBtn = document.getElementById('depositBtn');
const withdrawBtn = document.getElementById('withdrawBtn');
const generateBtn = document.getElementById('generateBtn');

// Désactiver au départ
depositBtn.disabled = true;
withdrawBtn.disabled = true;

// ======= Gestion onglets =======
window.openTab = function(tabName){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`.tab[onclick="openTab('${tabName}')"]`).classList.add('active');
  document.getElementById(tabName).classList.add('active');
};

// ======= Animation bulles =======
function createBubbles(num=30){
  const container = document.getElementById('bubbles');
  for(let i=0;i<num;i++){
    const bubble = document.createElement('div');
    bubble.className='bubble';
    const size=Math.random()*50+30;
    bubble.style.width=size+'px';
    bubble.style.height=size+'px';
    bubble.style.left=Math.random()*100+'vw';
    bubble.style.animationDuration=(8+Math.random()*12)+'s';
    container.appendChild(bubble);
  }
}
createBubbles();

// ======= Vérification connexion =======
onAuthStateChanged(auth, (user) => {
  if(!user){
    alert("Utilisateur non connecté !");
    window.location.href = "index.html";
    return;
  }
  alert("Utilisateur connecté : " + user.email);
  currentUser = user;
  if(!user){ window.location.href = "index.html"; return; }
  currentUser = user;
  console.log("Utilisateur connecté :", user.email);

  // Activer boutons et lier fonctions
  depositBtn.disabled = false;
  withdrawBtn.disabled = false;
  generateBtn.addEventListener('click', generateUSSD);
  depositBtn.addEventListener('click', () => alert("Bouton Dépôt cliqué !"));
  depositBtn.addEventListener('click', processDeposit);
  withdrawBtn.addEventListener('click', requestWithdraw);
});

// ======= Fonctions =======
function generateUSSD(){
  const amount = document.getElementById('amount').value;
  const network = document.getElementById('network').value;
  const errorEl = document.getElementById('error');
  const ussdEl = document.getElementById('ussd');
  errorEl.innerText=''; ussdEl.innerText='';
  if(!amount || !network){ errorEl.innerText="Veuillez remplir tous les champs."; return; }
  let code = network==='mtn'? `*880*41*177125*${amount}#`
           : network==='moov'? `*855*4*1*264081*${amount}#`
           : network==='celtiis'? `*889*6*1*ESS02*${amount}#`
           : `*144*2*1*177125*${amount}#`;
  ussdEl.innerText=`Code USSD à composer: ${code}`;
}

async function processDeposit(){
  alert("Bouton Dépôt cliqué !");  // <-- ça nous dira si le clic fonctionne

  const amount = parseInt(document.getElementById('amount').value);
  const phone = document.getElementById('phone').value;
  const network = document.getElementById('network').value;
  const message = document.getElementById('message').value;
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  errorEl.innerText=''; 
  successEl.innerText='';

  if(!amount || !phone || !network || !message){
    errorEl.innerText="Tous les champs sont requis !"; 
    return; 
  }
  if(!currentUser){ 
    errorEl.innerText="Utilisateur non connecté."; 
    return; 
  }

  try{
    await push(ref(db, `pendingDeposits/${currentUser.uid}`), {
      email: currentUser.email, 
      amount, 
      phone, 
      network, 
      message, 
      date: new Date().toLocaleString()
    });
    successEl.innerText = "Demande de dépôt envoyée à l'admin pour approbation.";
    document.getElementById('amount').value='';
    document.getElementById('phone').value='';
    document.getElementById('network').value='';
    document.getElementById('message').value='';
    document.getElementById('ussd').innerText='';
  }catch(err){ 
    errorEl.innerText="Erreur : "+err.message; 
  }
}


async function requestWithdraw(){
  const amount = parseInt(document.getElementById('withdrawAmount').value);
  const phone = document.getElementById('withdrawPhone').value;
  const errorEl = document.getElementById('errorRetrait');
  const successEl = document.getElementById('successRetrait');
  errorEl.innerText=''; successEl.innerText='';
  if(!amount || !phone){ errorEl.innerText="Veuillez saisir le montant et le numéro !"; return; }
  if(!currentUser){ errorEl.innerText="Utilisateur non connecté."; return; }
  try{
    await push(ref(db, `pendingWithdraws/${currentUser.uid}`), {email: currentUser.email, amount, phone, date:new Date().toLocaleString()});
    successEl.innerText = "Demande de retrait envoyée ! L’admin doit l’approuver.";
    document.getElementById('withdrawAmount').value='';
    document.getElementById('withdrawPhone').value='';
  }catch(err){ errorEl.innerText="Erreur : "+err.message; }
}
</script>
</body>
</html>
