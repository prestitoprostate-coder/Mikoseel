<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikoseel — Dépôt & Retrait</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0c001a,#4c1d95);
    color: #fff;
    padding: 20px;
  }
  h1{text-align:center;margin-bottom:30px;}

  /* --- Onglets --- */
  .tabs{
    display:flex;
    justify-content:center;
    margin-bottom:25px;
    gap:10px;
  }
  .tab{
    padding:10px 20px;
    border-radius:8px;
    background:rgba(255,255,255,0.1);
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
  }
  .tab.active{
    background:linear-gradient(90deg,#6d28d9,#ec4899);
  }

  form{
    max-width:720px;
    margin:0 auto;
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
  }
  .field{margin-bottom:12px;}
  label{display:block;margin-bottom:6px;font-weight:600;}
  input,select,textarea{
    width:100%;padding:10px;border:none;border-radius:6px;
    background:rgba(255,255,255,0.08);color:#fff;
  }
  input::placeholder,textarea::placeholder{color:#ddd;}
  button,input[type="submit"]{
    width:100%;padding:12px;border:none;border-radius:6px;
    background:linear-gradient(90deg,#6d28d9,#ec4899);
    color:#fff;font-weight:bold;cursor:pointer;
  }
  #preview{display:none;max-width:100%;margin-top:8px;border-radius:6px;border:2px solid rgba(255,255,255,0.06);}
  .ussd-box{
    margin-top:12px;
    padding:15px;
    background:rgba(236,72,153,0.15);
    color:#fff;
    font-size:20px;
    font-weight:bold;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
    transition:0.2s all;
  }
  .ussd-box:hover{
    background:rgba(236,72,153,0.3);
  }
  .valider-solde{
    max-width:720px;margin:25px auto;padding:20px;
    background:rgba(236,72,153,0.12);
    border:2px solid #ec4899;border-radius:10px;text-align:center;
  }
  .muted{color:#d6c6ff;font-size:13px;margin-top:8px;}
  .small{font-size:13px;color:#e0d7ff;margin-top:6px;}
</style>
</head>
<body>

<h1>📩 Mikoseel — Dépôt & Retrait</h1>

<!-- Onglets -->
<div class="tabs">
  <div class="tab active" data-target="depot">Dépôt</div>
  <div class="tab" data-target="retrait">Retrait</div>
</div>

<!-- FORMULAIRE DÉPÔT -->
<form id="form-depot" class="form-tab">
  <div class="field">
    <label for="name">Nom complet</label>
    <input type="text" name="name" id="name" placeholder="Ton nom complet" required>
  </div>

  <div class="field">
    <label for="user_name">Identifiant utilisateur</label>
    <input type="text" name="user_name" id="user_name" placeholder="Pseudo ou ID" required>
  </div>

  <div class="field">
    <label for="user_email">Adresse e-mail</label>
    <input type="email" name="user_email" id="user_email" placeholder="ton.email@exemple.com" required>
  </div>

  <div class="field">
    <label for="pack">Pack choisi</label>
    <select name="pack" id="pack" required>
      <option value="">-- Sélectionner un pack --</option>
      <option value="Bronze">Pack Bronze (2 000 – 5 000 FCFA)</option>
      <option value="Silver">Pack Silver (5 000 – 10 000 FCFA)</option>
      <option value="Gold">Pack Gold (10 000 – 50 000 FCFA)</option>
      <option value="Diamond">Pack Diamond (50 000 – 1 500 000 FCFA)</option>
    </select>
  </div>

  <div class="field">
    <label for="amount">Montant (FCFA)</label>
    <input type="number" name="amount" id="amount" placeholder="Ex: 5000" required>
  </div>

  <div class="field">
    <label for="method">Réseau</label>
    <select name="method" id="method" required>
      <option value="">-- Choisir un réseau --</option>
      <option value="mtn">MTN</option>
      <option value="moov">Moov</option>
      <option value="celtiis">Celtiis</option>
    </select>
  </div>

  <div class="field">
    <label for="phone">Numéro</label>
    <input type="tel" name="phone" id="phone" placeholder="Ex: 60000000" required>
  </div>

  <div id="ussdBox" class="ussd-box" title="Clique pour copier le code">Le code USSD apparaîtra ici</div>

  <div class="field">
    <label for="message">Message ou référence</label>
    <textarea name="message" id="message" rows="2" placeholder="Référence de la transaction" required></textarea>
  </div>

  <div class="field">
    <label for="proof">Capture de paiement</label>
    <input type="file" id="proofFile" accept="image/*" required>
    <input type="hidden" name="proof" id="proof">
    <img id="preview" alt="Aperçu preuve">
  </div>

  <input type="submit" id="button" value="Envoyer le mail">
  <p id="status" class="muted"></p>
</form>

<!-- FORMULAIRE RETRAIT -->
<form id="form-retrait" class="form-tab" style="display:none;">
  <div class="field">
    <label for="name2">Nom complet</label>
    <input type="text" name="name2" id="name2" placeholder="Ton nom complet" required>
  </div>

  <div class="field">
    <label for="user_name2">Identifiant utilisateur</label>
    <input type="text" name="user_name2" id="user_name2" placeholder="Pseudo ou ID" required>
  </div>

  <div class="field">
    <label for="phone2">Numéro de retrait</label>
    <input type="tel" name="phone2" id="phone2" placeholder="Ex: 60000000" required>
  </div>

  <div class="field">
    <label for="amount2">Montant à retirer (FCFA)</label>
    <input type="number" name="amount2" id="amount2" placeholder="Ex: 5000" required>
  </div>

  <div class="field">
    <label for="method2">Réseau</label>
    <select name="method2" id="method2" required>
      <option value="">-- Choisir un réseau --</option>
      <option value="mtn">MTN</option>
      <option value="moov">Moov</option>
      <option value="celtiis">Celtiis</option>
    </select>
  </div>

  <div class="field">
    <label for="message2">Message ou remarque</label>
    <textarea name="message2" id="message2" rows="2" placeholder="Remarques ou référence"></textarea>
  </div>

  <input type="submit" id="button2" value="Envoyer la demande de retrait">
  <p id="status2" class="muted"></p>
</form>

<div class="valider-solde">
  <h2>💰 Valider le solde</h2>
  <p>Après envoi du mail, clique ici pour aller sur la page de validation.</p>
  <a href="solde.html" style="color:#fff;font-weight:700;background:linear-gradient(90deg,#6d28d9,#ec4899);padding:10px 18px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:10px;">👉 Aller sur la page de validation</a>
</div>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init('6BLdU6p0YUHLeqINk'); 
const SERVICE_ID = 'default_service';
const TEMPLATE_ID = 'template_khilsn7';

/* --- Gestion des onglets --- */
const tabs = document.querySelectorAll('.tab');
const forms = document.querySelectorAll('.form-tab');
tabs.forEach(tab=>{
  tab.addEventListener('click', ()=>{
    tabs.forEach(t=>t.classList.remove('active'));
    forms.forEach(f=>f.style.display='none');
    tab.classList.add('active');
    document.getElementById('form-'+tab.dataset.target).style.display='block';
  });
});

/* --- Code USSD --- */
function makeUSSD(network, amount){
  if(!network || !amount) return '';
  amount = parseInt(amount) || 0;
  switch(network){
    case 'mtn': return `*880*41*177125*${amount}#`;
    case 'celtiis': return `*889*6*1*ESS02*${amount}#`;
    case 'moov': return `*851*4*1*264081*${amount}#`;
    default: return '';
  }
}
const phoneEl = document.getElementById('phone');
const amountEl = document.getElementById('amount');
const methodEl = document.getElementById('method');
const ussdBox = document.getElementById('ussdBox');
function updateUSSD(){
  const code = makeUSSD(methodEl.value, amountEl.value);
  ussdBox.textContent = code || 'Le code USSD apparaîtra ici';
}
[phoneEl, amountEl, methodEl].forEach(el=>el.addEventListener('input', updateUSSD));

/* --- Copie du code USSD --- */
ussdBox.addEventListener('click', ()=>{
  const txt = ussdBox.textContent.trim();
  if(txt && txt.includes('*')) navigator.clipboard.writeText(txt).then(()=>alert('Code USSD copié ✅ : ' + txt));
});

/* --- Gestion de l’envoi EmailJS (formulaire dépôt) --- */
const formDepot = document.getElementById('form-depot');
const btn = document.getElementById('button');
const proofFile = document.getElementById('proofFile');
const preview = document.getElementById('preview');
const proofHidden = document.getElementById('proof');
const statusEl = document.getElementById('status');

proofFile.addEventListener('change', ()=>{
  const file = proofFile.files[0];
  if(!file){ preview.style.display='none'; proofHidden.value=''; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    proofHidden.value = e.target.result;
    preview.src = e.target.result;
    preview.style.display='block';
  };
  reader.readAsDataURL(file);
});

formDepot.addEventListener('submit', e=>{
  e.preventDefault();
  btn.value='Envoi...';
  if(!proofHidden.value){ alert('Veuillez joindre la capture de paiement.'); btn.value='Envoyer le mail'; return; }
  emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, formDepot)
  .then(()=>{ btn.value='Envoyer le mail'; statusEl.textContent='✅ Mail envoyé avec succès.'; alert('Mail envoyé ✅'); formDepot.reset(); preview.style.display='none'; ussdBox.textContent='Le code USSD apparaîtra ici'; })
  .catch(err=>{ btn.value='Envoyer le mail'; statusEl.textContent='❌ Erreur : '+(err.text||JSON.stringify(err)); alert('Erreur mail : '+(err.text||JSON.stringify(err))); });
});

/* --- Gestion du formulaire Retrait (similaire mais sans capture) --- */
const formRetrait = document.getElementById('form-retrait');
const btn2 = document.getElementById('button2');
const status2 = document.getElementById('status2');
formRetrait.addEventListener('submit', e=>{
  e.preventDefault();
  btn2.value='Envoi...';
  emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, formRetrait)
  .then(()=>{ btn2.value='Envoyer la demande de retrait'; status2.textContent='✅ Demande envoyée avec succès.'; alert('Demande de retrait envoyée ✅'); formRetrait.reset(); })
  .catch(err=>{ btn2.value='Envoyer la demande de retrait'; status2.textContent='❌ Erreur : '+(err.text||JSON.stringify(err)); alert('Erreur : '+(err.text||JSON.stringify(err))); });
});
</script>
</body>
</html>
