<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dépôt - Mikosell Pro</title>
<style>
body { font-family:'Poppins',sans-serif; background:#1a1a2e; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.container { background: rgba(255,255,255,0.05); padding:40px; border-radius:20px; width:350px; text-align:center; box-shadow:0 0 20px rgba(0,0,0,0.5); }
h2 { color:#ffcc00; margin-bottom:20px; }
input, select, textarea { width:100%; padding:10px; border-radius:10px; border:none; margin-bottom:15px; }
button { padding:10px 20px; border:none; border-radius:10px; background:#ffcc00; color:#1a1a2e; font-weight:bold; cursor:pointer; transition:0.3s; margin:5px 0; }
button:hover { background:#ff9900; }
#ussd { color:#ffcc00; margin-bottom:15px; }
#error { color:#ff4d4d; margin-bottom:10px; }
#success { color:#00ff99; margin-bottom:10px; }
</style>
</head>
<body>
<div class="container">
  <h2>Dépôt</h2>
  <div id="error"></div>
  <div id="success"></div>

  <input type="number" id="amount" placeholder="Montant (FCFA)">
  <input type="text" id="phone" placeholder="Numéro du déposant">
  <select id="network">
    <option value="">Choisir réseau</option>
    <option value="mtn">MTN Money</option>
    <option value="moov">Moov</option>
  </select>

  <div id="ussd"></div>

  <textarea id="message" placeholder="Collez ici le message reçu après dépôt" rows="4"></textarea>

  <button onclick="generateUSSD()">Générer le code USSD</button>
  <button onclick="sendDeposit()">Envoyer la demande</button>
</div>


<button onclick="window.location.href='admin.html'">Page Admin</button>




<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.firebasestorage.app",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:ee5b850dc31cbb8776bc84",
  measurementId: "G-BSZJ5PW639"
};
firebase.initializeApp(firebaseConfig);
const analytics = firebase.analytics();
const db = firebase.firestore();

function generateUSSD() {
  const amount = document.getElementById('amount').value;
  const phone = document.getElementById('phone').value;
  const network = document.getElementById('network').value;
  const errorEl = document.getElementById('error');
  const ussdEl = document.getElementById('ussd');
  errorEl.innerText=''; ussdEl.innerText='';

  if(!amount || !phone || !network){
    errorEl.innerText = "Veuillez remplir tous les champs.";
    return;
  }

  let code = '';
  if(network==='mtn') code = `*880*41*177125*${amount}#`;
  else if(network==='moov') code = `*855*4*1*264081*${amount}#`;

  ussdEl.innerText = `Code USSD à composer: ${code}`;
}

function sendDeposit() {
  const amount = +document.getElementById('amount').value;
  const phone = document.getElementById('phone').value;
  const network = document.getElementById('network').value;
  const message = document.getElementById('message').value;
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  errorEl.innerText=''; successEl.innerText='';

  if(!amount || !phone || !network || !message){
    errorEl.innerText = "Tous les champs sont requis !";
    return;
  }

  // Ajout dans Firestore
  db.collection("deposits").add({
    amount: amount,
    phone: phone,
    network: network,
    message: message,
    date: firebase.firestore.FieldValue.serverTimestamp(),
    status: "pending",
    userEmail: localStorage.getItem('loggedInUser') || "inconnu"
  })
  .then(() => {
    // ✅ Affiche Succès immédiatement
    successEl.innerText = "Demande envoyée avec succès !";

    // Réinitialise le formulaire
    document.getElementById('amount').value='';
    document.getElementById('phone').value='';
    document.getElementById('network').value='';
    document.getElementById('message').value='';
    document.getElementById('ussd').innerText='';
  })
  .catch(err => {
    console.error(err);
    errorEl.innerText = "Erreur lors de l'envoi.";
  });
}
</script>
</body>
</html>
