<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mikoseel — Dépôt & Retrait (PRODUCTION-safe)</title>
<style>
:root{ --violet-dark:#0c001a; --violet:#4c1d95; --violet-mid:#6d28d9; --rose:#ec4899; --text-light:#e9d5ff; }
body{margin:0;font-family:Poppins,system-ui,Arial;background:linear-gradient(120deg,var(--violet-dark),var(--violet),var(--violet-mid));color:var(--text-light);min-height:100vh;padding:18px;}
.container{max-width:920px;margin:0 auto;}
.card{background:rgba(10,0,30,0.55);padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,0.25);}
input,select,textarea,button{width:100%;padding:10px;border-radius:8px;border:none;background:rgba(255,255,255,0.04);color:var(--text-light);margin-top:8px;}
button.primary{background:linear-gradient(90deg,var(--violet-mid),var(--rose));color:#fff;font-weight:700;cursor:pointer;}
.small-muted{font-size:13px;color:#d6c6ff;margin-top:6px;}
.pack-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0;}
.pack{padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));cursor:pointer;text-align:center;}
#previewImg{max-width:100%;max-height:180px;border-radius:8px;margin-top:8px;display:none;}
.row{display:flex;gap:12px;}
.col{flex:1;}
</style>
<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<!-- Firebase SDKs -->
<script type="module">
  // NOTE: we will import Firebase SDK in the module below
</script>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Mikoseel — Dépôt & Retrait</h1>
    <div id="userEmailDisplay" class="small-muted"></div>
  </div>

  <div class="card">
    <h2>Dépôt</h2>
    <label>Pack</label>
    <input id="depositPack" readonly placeholder="Choisir un pack ci-dessous">
    <div class="pack-list" id="packsContainer"></div>
    <div class="row">
      <div class="col"><label>Montant (FCFA)</label><input type="number" id="depositAmount" min="1" /></div>
      <div class="col"><label>Réseau</label><select id="depositNetwork"><option value="">--Choisir--</option><option value="mtn">MTN</option><option value="celtiis">Celtiis</option><option value="moov">Moov</option></select></div>
    </div>
    <label>Numéro (obligatoire)</label><input id="depositPhone" placeholder="Ex: 60000000" />
    <label>USSD généré (ne pas exécuter automatiquement)</label><input id="ussdCode" readonly />
    <label>Message transaction</label><textarea id="transactionMessage" rows="3"></textarea>
    <label>Preuve (photo)</label><input type="file" id="depositProof" accept="image/*" /><img id="previewImg" alt="aperçu" />
    <button id="depositSubmit" class="primary" disabled>Soumettre dépôt (en attente validation)</button>
    <p id="depositStatus" class="small-muted"></p>
  </div>

  <div class="card">
    <h2>Retrait</h2>
    <label>Montant (FCFA)</label><input id="withdrawAmount" type="number" min="1" />
    <label>Méthode</label><select id="withdrawNetwork"><option value="">--Choisir--</option><option value="mtn">MTN</option><option value="celtiis">Celtiis</option><option value="moov">Moov</option><option value="virement">Virement</option></select>
    <label>Numéro</label><input id="withdrawPhone" placeholder="Ex: 60000000" />
    <label>Message</label><textarea id="withdrawMessage" rows="2"></textarea>
    <button id="withdrawSubmit" class="primary" disabled>Soumettre retrait (en attente validation)</button>
    <p id="withdrawStatus" class="small-muted"></p>
  </div>

  <div class="card">
    <h3>Solde</h3>
    <p id="balanceDisplay">0 FCFA</p>
  </div>
</div>

<script type="module">
/* ---------- CONFIGURE ICI (remplace les placeholders) ---------- */
const firebaseConfig = {
  apiKey: "REPLACE_FIREBASE_APIKEY",
  authDomain: "REPLACE_FIREBASE_AUTHDOMAIN",
  projectId: "REPLACE_FIREBASE_PROJECTID",
  storageBucket: "REPLACE_FIREBASE_STORAGEBUCKET",
  messagingSenderId: "REPLACE_FIREBASE_MESSAGINGSENDERID",
  appId: "REPLACE_FIREBASE_APPID"
};
const EMAILJS_PUBLIC_KEY = "REPLACE_EMAILJS_PUBLIC_KEY";
const EMAILJS_SERVICE_ID = "REPLACE_EMAILJS_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "REPLACE_EMAILJS_TEMPLATE_ID";
const ADMIN_EMAIL = "remplace@tonmail.com"; // adresse qui recevra la notification
/* ------------------------------------------------------------- */

/* Imports Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

emailjs.init(EMAILJS_PUBLIC_KEY);

/* UI refs */
const depositPack = document.getElementById('depositPack');
const packsContainer = document.getElementById('packsContainer');
const depositAmount = document.getElementById('depositAmount');
const depositNetwork = document.getElementById('depositNetwork');
const depositPhone = document.getElementById('depositPhone');
const ussdCode = document.getElementById('ussdCode');
const transactionMessage = document.getElementById('transactionMessage');
const depositProof = document.getElementById('depositProof');
const previewImg = document.getElementById('previewImg');
const depositSubmit = document.getElementById('depositSubmit');
const depositStatus = document.getElementById('depositStatus');
const withdrawAmount = document.getElementById('withdrawAmount');
const withdrawNetwork = document.getElementById('withdrawNetwork');
const withdrawPhone = document.getElementById('withdrawPhone');
const withdrawMessage = document.getElementById('withdrawMessage');
const withdrawSubmit = document.getElementById('withdrawSubmit');
const withdrawStatus = document.getElementById('withdrawStatus');
const balanceDisplay = document.getElementById('balanceDisplay');
const userEmailDisplay = document.getElementById('userEmailDisplay');

let currentUserEmail = null;
let lastProofBase64 = '';

/* packs */
const packs = [
  { name: 'Pack Bronze', min: 2000, max: 5000, gain: 250 },
  { name: 'Pack Silver', min: 5000, max: 10000, gain: 900 },
  { name: 'Pack Gold', min: 10000, max: 50000, gain: 2000 },
  { name: 'Pack Diamond', min: 50000, max: 1500000, gain: 12000 }
];
packs.forEach(p=>{
  const d=document.createElement('div'); d.className='pack';
  d.innerHTML=`<h4>${p.name}</h4><div class="small-muted">Invest: ${p.min.toLocaleString()} - ${p.max.toLocaleString()} FCFA</div><div class="small-muted">Gains/12h: ${p.gain.toLocaleString()} FCFA</div>`;
  d.onclick=()=>{ depositPack.value=p.name; depositAmount.value=p.min; updateUSSD(); checkDepositEnable(); };
  packsContainer.appendChild(d);
});

/* init Firebase */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* helpers */
function encodeEmailForId(email){
  return String(email).replaceAll('.','_dot_').replaceAll('@','_at_');
}
function escapeHtml(str){ if(!str) return ''; return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
function showError(el, msg){ if(el) el.textContent = msg || ''; console.error(msg); }

/* USSD */
function makeUSSD(network, amount){
  if(!network||!amount) return '';
  switch(network){
    case 'mtn': return `*880*41*177125*${amount}#`;
    case 'celtiis': return `*889*6*1*ESS02*${amount}#`;
    case 'moov': return `*851*4*1*264081*${amount}#`;
    default: return '';
  }
}
function updateUSSD(){
  const code = makeUSSD(depositNetwork.value, parseInt(depositAmount.value)||0);
  ussdCode.value = code || '';
}
['depositNetwork','depositAmount'].forEach(id=>document.getElementById(id).addEventListener('input',updateUSSD));

/* preview image */
depositProof.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file){ previewImg.style.display='none'; lastProofBase64=''; checkDepositEnable(); return; }
  const reader = new FileReader();
  reader.onload = ev=>{ previewImg.src=ev.target.result; previewImg.style.display='block'; lastProofBase64=ev.target.result; checkDepositEnable(); };
  reader.readAsDataURL(file);
});

/* enable buttons */
function checkDepositEnable(){
  const phoneOk = depositPhone.value.trim().length>=6;
  const msgOk = transactionMessage.value.trim().length>0;
  const proofOk = lastProofBase64!=='';
  const ussdOk = ussdCode.value.trim().length>0;
  depositSubmit.disabled = !(phoneOk && msgOk && proofOk && ussdOk);
}
['depositPhone','transactionMessage'].forEach(id=>document.getElementById(id).addEventListener('input',checkDepositEnable));

function checkWithdrawEnable(){
  const amt=parseInt(withdrawAmount.value)||0;
  const method=withdrawNetwork.value;
  const phone=withdrawPhone.value.trim();
  const msg=withdrawMessage.value.trim();
  withdrawSubmit.disabled=!(amt>0 && method && phone.length>=6 && msg.length>0);
}
[withdrawAmount,withdrawNetwork,withdrawPhone,withdrawMessage].forEach(el=>el.addEventListener('input',checkWithdrawEnable));

/* Auth state */
onAuthStateChanged(auth, async user => {
  if(user && user.email){
    currentUserEmail = user.email;
    userEmailDisplay.textContent = currentUserEmail;
    await loadBalance();
  } else {
    // Si pas connecté, on peut demander login (email/password) — pour test on redirige vers login
    // Pour l'instant, tenter une connexion test automatique si tu veux (à configurer côté dev)
    userEmailDisplay.textContent = "Non connecté — connecte-toi avec email/password";
    // EXEMPLE de connexion automatique (décommente et renseigne si souhaité)
    // await signInWithEmailAndPassword(auth, "test.user@example.com", "MotDePasseTest123");
  }
});

/* Load balance */
async function loadBalance(){
  try{
    const id = encodeEmailForId(currentUserEmail);
    const userRef = doc(db,'users',id);
    const snap = await getDoc(userRef);
    if(!snap.exists()){
      await setDoc(userRef, { balance: 0, history: [], createdAt: serverTimestamp() });
      balanceDisplay.textContent = "0 FCFA";
      return;
    }
    const data = snap.data();
    balanceDisplay.textContent = ((data.balance||0).toLocaleString()) + " FCFA";
  }catch(err){ showError(depositStatus, "Erreur lecture solde: " + (err.message||err)); }
}

/* send email via EmailJS (notification to admin) */
async function sendNotificationEmail(payload){
  // payload: { to_email, subject, messageHtml, plain }
  try{
    const templateParams = {
      to_email: payload.to_email || ADMIN_EMAIL,
      subject: payload.subject,
      message: payload.plain || JSON.stringify(payload),
      user_email: currentUserEmail || "unknown",
      raw_data: JSON.stringify(payload)
    };
    const res = await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
    console.log("EmailJS res:", res);
    return res;
  } catch(err){
    console.error("EmailJS error", err);
    throw err;
  }
}

/* deposit submit: ENREGISTRE l'opération en Firestore avec status='pending' puis notifie admin (pas d'automatisation de paiement) */
depositSubmit.addEventListener('click', async ()=>{
  depositStatus.textContent = "Soumission en cours...";
  depositSubmit.disabled = true;
  try{
    const amount = parseInt(depositAmount.value);
    const method = depositNetwork.value;
    const phone = depositPhone.value.trim();
    const message = transactionMessage.value.trim();
    const proof = lastProofBase64;
    if(!amount||!method||!phone||!message||!proof) throw new Error("Champs manquants");

    const uid = encodeEmailForId(currentUserEmail);
    const userRef = doc(db,'users', uid);

    // read current
    const snap = await getDoc(userRef);
    let balance = 0;
    let history = [];
    if(snap.exists()){
      const d = snap.data();
      balance = d.balance || 0;
      history = d.history || [];
    } else {
      // create baseline
      await setDoc(userRef, { balance: 0, history: [], createdAt: serverTimestamp() });
    }

    // create operation doc inside users/{uid}/operations (or append to history array)
    // Here we append to 'history' array (careful with large arrays; better to use subcollection in production)
    const op = {
      type: 'deposit',
      amount,
      method,
      phone,
      message,
      proof: proof, // WARNING: storing base64 in Firestore can be heavy; prefer upload to Firebase Storage in prod
      status: 'pending',
      createdAt: serverTimestamp()
    };
    // append to history and update (merge)
    history.unshift(Object.assign({}, op, { createdAt: new Date().toLocaleString() }));
    await setDoc(userRef, { balance: balance, history: history }, { merge: true });

    // Notify admin
    await sendNotificationEmail({
      to_email: ADMIN_EMAIL,
      subject: `Nouvelle demande de dépôt : ${amount} FCFA`,
      plain: `Utilisateur: ${currentUserEmail}\nMontant: ${amount}\nMéthode: ${method}\nTéléphone: ${phone}\nMessage: ${message}\nStatut: pending`
    });

    depositStatus.textContent = "Dépôt enregistré (status pending). L'administrateur a été notifié.";
    alert("Dépôt enregistré. Attendez la validation manuelle de l'administrateur.");
    // reset fields
    depositPack.value=''; depositAmount.value=''; depositNetwork.value=''; depositPhone.value=''; ussdCode.value=''; transactionMessage.value=''; depositProof.value=''; previewImg.style.display='none'; lastProofBase64=''; checkDepositEnable();
    await loadBalance();
  }catch(err){
    showError(depositStatus, "Erreur dépôt: " + (err.message||err));
    alert("Erreur lors de la soumission: " + (err.message||err));
  } finally {
    depositSubmit.disabled = false;
  }
});

/* withdraw submit: enregistre en pending et notifie admin */
withdrawSubmit.addEventListener('click', async ()=>{
  withdrawStatus.textContent = "Soumission en cours...";
  withdrawSubmit.disabled = true;
  try{
    const amount = parseInt(withdrawAmount.value);
    const method = withdrawNetwork.value;
    const phone = withdrawPhone.value.trim();
    const message = withdrawMessage.value.trim();
    if(!amount||!method||!phone||!message) throw new Error("Champs manquants");

    const uid = encodeEmailForId(currentUserEmail);
    const userRef = doc(db,'users', uid);
    const snap = await getDoc(userRef);
    if(!snap.exists()) throw new Error("Utilisateur introuvable ou solde insuffisant");
    const data = snap.data();
    const balance = data.balance || 0;
    let history = data.history || [];
    if(balance < amount) throw new Error("Solde insuffisant");

    // register withdraw request (do not change balance until admin validates)
    const op = { type:'withdraw', amount, method, phone, message, status:'pending', createdAt: serverTimestamp() };
    history.unshift(Object.assign({}, op, { createdAt: new Date().toLocaleString() }));
    await setDoc(userRef, { history: history }, { merge: true });

    await sendNotificationEmail({
      to_email: ADMIN_EMAIL,
      subject: `Nouvelle demande de retrait : ${amount} FCFA`,
      plain: `Utilisateur: ${currentUserEmail}\nMontant: ${amount}\nMéthode: ${method}\nTéléphone: ${phone}\nMessage: ${message}\nStatut: pending`
    });

    withdrawStatus.textContent = "Retrait enregistré (status pending). L'administrateur a été notifié.";
    alert("Retrait enregistré. L'administrateur doit valider manuellement.");
    withdrawAmount.value=''; withdrawNetwork.value=''; withdrawPhone.value=''; withdrawMessage.value=''; checkWithdrawEnable();
  }catch(err){
    showError(withdrawStatus, "Erreur retrait: " + (err.message||err));
    alert("Erreur lors de la soumission: " + (err.message||err));
  } finally { withdrawSubmit.disabled = false; }
});

</script>
</body>
</html>
