<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikoseel — Dépôt & Retrait</title>
<style>
body{margin:0;color:#e9d5ff;background:linear-gradient(120deg,#0c001a,#4c1d95,#6d28d9);font-family:"Poppins",sans-serif;min-height:100vh;padding:20px;}
h1,h2{margin:0 0 10px 0;}
.container{max-width:700px;margin:auto;}
input, select, textarea, button{width:100%;margin:6px 0;padding:10px;border-radius:8px;border:none;}
button{background:linear-gradient(90deg,#6d28d9,#ec4899);color:#fff;font-weight:600;cursor:pointer;}
.pack-list{display:flex;gap:10px;margin:10px 0;}
.pack{flex:1;padding:12px;text-align:center;border-radius:10px;background:#444;cursor:pointer;transition:transform 0.2s;}
.pack.selected{background:#a855f7;transform:scale(1.05);}
#previewImg{max-width:100%;max-height:150px;margin-top:6px;border-radius:10px;opacity:0.6;display:none;}
#status{margin-top:10px;color:yellow;font-weight:bold;}
.tabs{display:flex;gap:10px;margin-bottom:20px;}
.tab-btn{flex:1;padding:10px;border:none;border-radius:10px;background:#333;color:#fff;cursor:pointer;}
.tab-btn.active{background:linear-gradient(90deg,#6d28d9,#ec4899);}
.section{display:none;}
.section.active{display:block;}
</style>
</head>
<body>

<h1>Mikoseel — Dépôt & Retrait</h1>

<div class="tabs">
  <button class="tab-btn active" data-target="depositSection">Dépôt</button>
  <button class="tab-btn" data-target="withdrawSection">Retrait</button>
</div>

<div class="container">

  <!-- Packs -->
  <div class="pack-list" id="packsContainer"></div>

  <!-- Dépôt -->
  <div class="section active" id="depositSection">
    <h2>Dépôt</h2>
    <form id="depositForm">
      <label>Pack sélectionné</label>
      <input type="text" id="depositPack" readonly placeholder="Choisissez un pack">
      <label>Nom</label>
      <input type="text" id="userName" placeholder="Votre nom">
      <label>Email</label>
      <input type="email" id="userEmail" placeholder="Votre email">
      <label>Montant (FCFA)</label>
      <input type="number" id="depositAmount" min="1">
      <label>Réseau</label>
      <select id="depositNetwork">
        <option value="">-- Choisir --</option>
        <option value="mtn">MTN</option>
        <option value="celtiis">Celtiis</option>
        <option value="moov">Moov</option>
      </select>
      <label>Numéro</label>
      <input type="text" id="depositPhone" placeholder="Ex: 60000000">
      <label>USSD généré</label>
      <input type="text" id="ussdCode" readonly>
      <label>Message</label>
      <textarea id="transactionMessage" rows="2"></textarea>
      <label>Capture paiement</label>
      <input type="file" id="depositProof" accept="image/*">
      <img id="previewImg">
      <button type="submit">Valider Dépôt & Envoyer Email</button>
    </form>
    <p id="status"></p>
  </div>

  <!-- Retrait -->
  <div class="section" id="withdrawSection">
    <h2>Retrait</h2>
    <form id="withdrawForm">
      <label>Nom</label>
      <input type="text" id="withdrawName" placeholder="Votre nom">
      <label>Email</label>
      <input type="email" id="withdrawEmail" placeholder="Votre email">
      <label>Montant (FCFA)</label>
      <input type="number" id="withdrawAmount" min="1">
      <label>Méthode</label>
      <select id="withdrawNetwork">
        <option value="">-- Choisir --</option>
        <option value="mtn">MTN</option>
        <option value="celtiis">Celtiis</option>
        <option value="moov">Moov</option>
        <option value="virement">Virement Bancaire</option>
      </select>
      <label>Numéro</label>
      <input type="text" id="withdrawPhone" placeholder="Ex: 60000000">
      <label>Message</label>
      <textarea id="withdrawMessage" rows="2"></textarea>
      <button type="submit">Valider Retrait & Envoyer Email</button>
    </form>
    <p id="statusWithdraw"></p>
  </div>

</div>

<script type="module" src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
emailjs.init("6BLdU6p0YUHLeqINk");

// Packs
const packs = [
  {name:"Bronze", min:2000},
  {name:"Silver", min:5000},
  {name:"Gold", min:10000},
  {name:"Diamond", min:50000}
];

const packsContainer = document.getElementById("packsContainer");
packs.forEach(p=>{
  const div = document.createElement("div");
  div.className="pack";
  div.innerText = p.name + "\nMin: " + p.min + " FCFA";
  div.onclick = ()=>{
    document.getElementById("depositPack").value = p.name;
    document.getElementById("depositAmount").value = p.min;
    document.querySelectorAll(".pack").forEach(x=>x.classList.remove("selected"));
    div.classList.add("selected");
    updateUSSD();
  };
  packsContainer.appendChild(div);
});

// Tabs
const tabs = document.querySelectorAll(".tab-btn");
const sections = document.querySelectorAll(".section");
tabs.forEach(tab=>{
  tab.addEventListener("click", ()=>{
    tabs.forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    sections.forEach(s=>s.classList.remove("active"));
    document.getElementById(tab.dataset.target).classList.add("active");
  });
});

// USSD
function updateUSSD(){
  const network = document.getElementById("depositNetwork").value;
  const amount = parseInt(document.getElementById("depositAmount").value)||0;
  const phone = document.getElementById("depositPhone").value.trim();
  const ussd = document.getElementById("ussdCode");
  if(!network || amount<=0 || !phone){ ussd.value=''; return; }
  switch(network){
    case 'mtn': ussd.value=`*880*41*177125*${amount}#`; break;
    case 'celtiis': ussd.value=`*889*6*1*ESS02*${amount}#`; break;
    case 'moov': ussd.value=`*851*4*1*264081*${amount}#`; break;
    default: ussd.value=''; break;
  }
}
['depositNetwork','depositAmount','depositPhone'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateUSSD);
});

// Preview image
document.getElementById('depositProof').addEventListener('change', e=>{
  const file = e.target.files[0];
  const img = document.getElementById('previewImg');
  if(file){
    const reader = new FileReader();
    reader.onload = ev=>{ img.src = ev.target.result; img.style.display='block'; };
    reader.readAsDataURL(file);
  } else { img.style.display='none'; }
});

// Submit Dépôt
document.getElementById('depositForm').addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById("userName").value;
  const email = document.getElementById("userEmail").value;
  const pack = document.getElementById("depositPack").value;
  const amount = document.getElementById("depositAmount").value;
  const method = document.getElementById("depositNetwork").value;
  const phone = document.getElementById("depositPhone").value;
  const message = document.getElementById("transactionMessage").value;
  const proofFile = document.getElementById("depositProof").files[0];
  const status = document.getElementById("status");

  if(!name||!email||!pack||!amount||!method||!phone){
    status.innerText="Veuillez remplir tous les champs obligatoires !";
    return;
  }

  status.innerText="Envoi de l'email...";

  function sendEmail(proof){
    emailjs.send('service_typd4jv','template_khilsn7',{
      user_name: name,
      user_email: email,
      type: "Dépôt",
      pack: pack,
      amount: amount,
      method: method,
      phone: phone,
      message: message,
      proof: proof || "Aucune preuve fournie"
    }).then(res=>{
      status.innerText="Email envoyé avec succès ✅";
      console.log(res);
      document.getElementById('depositForm').reset();
      document.getElementById('previewImg').style.display='none';
      document.getElementById('ussdCode').value='';
    }).catch(err=>{
      status.innerText="Erreur lors de l'envoi ❌";
      console.error(err);
    });
  }

  if(proofFile){
    const reader = new FileReader();
    reader.onload = ev=>sendEmail(ev.target.result);
    reader.readAsDataURL(proofFile);
  } else { sendEmail(); }
});

// Submit Retrait
document.getElementById('withdrawForm').addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById("withdrawName").value;
  const email = document.getElementById("withdrawEmail").value;
  const amount = document.getElementById("withdrawAmount").value;
  const method = document.getElementById("withdrawNetwork").value;
  const phone = document.getElementById("withdrawPhone").value;
  const message = document.getElementById("withdrawMessage").value;
  const status = document.getElementById("statusWithdraw");

  if(!name||!email||!amount||!method||!phone){
    status.innerText="Veuillez remplir tous les champs obligatoires !";
    return;
  }

  status.innerText="Envoi de l'email...";

  emailjs.send('service_typd4jv','template_khilsn7',{
    user_name:name,
    user_email:email,
    type:"Retrait",
    amount:amount,
    method:method,
    phone:phone,
    message:message,
    proof:"N/A"
  }).then(res=>{
    status.innerText="Email Retrait envoyé ✅";
    console.log(res);
    document.getElementById('withdrawForm').reset();
  }).catch(err=>{
    status.innerText="Erreur lors de l'envoi ❌";
    console.error(err);
  });
});
</script>
</body>
</html>
