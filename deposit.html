<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mikoseel — Dépôt & Retrait (EmailJS + Firebase)</title>
<style>
:root{
  --violet-dark:#0c001a; --violet:#4c1d95; --violet-mid:#6d28d9; --rose:#ec4899; --text-light:#e9d5ff;
}
body{margin:0;font-family:Poppins,system-ui,Arial;background:linear-gradient(120deg,var(--violet-dark),var(--violet),var(--violet-mid));color:var(--text-light);min-height:100vh;padding:18px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.header h1{margin:0;}
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,0.04);cursor:pointer;}
.tab.active{background:linear-gradient(90deg,var(--violet-mid),var(--rose));}
.container{max-width:920px;margin:0 auto;}
.card{background:rgba(10,0,30,0.55);padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.3);margin-bottom:18px;}
.pack-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0;}
.pack{padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));cursor:pointer;text-align:center;}
input,select,textarea,button{width:100%;padding:10px;border-radius:8px;border:none;background:rgba(255,255,255,0.04);color:var(--text-light);margin-top:8px;}
button.primary{background:linear-gradient(90deg,var(--violet-mid),var(--rose));color:#fff;font-weight:700;cursor:pointer;}
.small-muted{font-size:13px;color:#d6c6ff;margin-top:6px;}
#previewImg{max-width:100%;max-height:180px;border-radius:8px;margin-top:8px;display:none;}
.row{display:flex;gap:12px;}
.col{flex:1;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Mikoseel — Dépôt & Retrait</h1>
    <div id="userEmailDisplay" class="small-muted"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-target="depositTab">Dépôt</div>
    <div class="tab" data-target="withdrawTab">Retrait</div>
  </div>

  <!-- DÉPÔT -->
  <div id="depositTab" class="card section active">
    <h2>Dépôt</h2>

    <label>Pack sélectionné</label>
    <input id="depositPack" readonly placeholder="Choisir un pack ci-dessous">

    <div class="pack-list" id="packsContainer"></div>

    <div class="row">
      <div class="col">
        <label>Montant (FCFA)</label>
        <input type="number" id="depositAmount" min="1" placeholder="Ex: 5000">
      </div>
      <div class="col">
        <label>Réseau</label>
        <select id="depositNetwork">
          <option value="">-- Choisir --</option>
          <option value="mtn">MTN</option>
          <option value="celtiis">Celtiis</option>
          <option value="moov">Moov</option>
        </select>
      </div>
    </div>

    <label>Numéro (obligatoire)</label>
    <input type="text" id="depositPhone" placeholder="Ex: 60000000">

    <label>USSD généré</label>
    <input id="ussdCode" readonly>

    <button id="executeUSSD" class="primary" style="display:none;margin-top:8px;">Exécuter la transaction</button>

    <label>Message de transaction (obligatoire)</label>
    <textarea id="transactionMessage" rows="3" placeholder="Indiquez la référence ou message transactionnel"></textarea>

    <label>Capture de paiement (photo) (obligatoire)</label>
    <input type="file" id="depositProof" accept="image/*">
    <img id="previewImg" alt="Aperçu preuve" />

    <button id="depositSubmit" class="primary" style="margin-top:14px;" disabled>Valider Dépôt</button>
    <p id="depositStatus" class="small-muted"></p>
  </div>

  <!-- RETRAIT -->
  <div id="withdrawTab" class="card section hidden">
    <h2>Retrait</h2>

    <label>Montant (FCFA)</label>
    <input type="number" id="withdrawAmount" min="1">

    <label>Méthode</label>
    <select id="withdrawNetwork">
      <option value="">-- Choisir --</option>
      <option value="mtn">MTN</option>
      <option value="celtiis">Celtiis</option>
      <option value="moov">Moov</option>
      <option value="virement">Virement Bancaire</option>
    </select>

    <label>Numéro (obligatoire)</label>
    <input type="text" id="withdrawPhone" placeholder="Ex: 60000000">

    <label>Message (obligatoire)</label>
    <textarea id="withdrawMessage" rows="2" placeholder="Info pour retrait"></textarea>

    <button id="withdrawSubmit" class="primary" disabled>Valider Retrait</button>
    <p id="withdrawStatus" class="small-muted"></p>
  </div>

  <!-- SOLDE -->
  <div class="card">
    <h3>Solde du compte</h3>
    <p id="balanceDisplay">0 FCFA</p>
  </div>
</div>

<!-- EmailJS (browser build) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("6BLdU6p0YUHLeqINk");</script>

<!-- Firebase modules (module script) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  // --- Ta config Firebase (utilise la tienne)
  const firebaseConfig = {
    apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
    authDomain: "valide-28624.firebaseapp.com",
    databaseURL: "https://valide-28624-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "valide-28624",
    storageBucket: "valide-28624.firebasestorage.app",
    messagingSenderId: "483447990733",
    appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ELEMENTS
  const depositPack = document.getElementById('depositPack');
  const packsContainer = document.getElementById('packsContainer');
  const depositAmount = document.getElementById('depositAmount');
  const depositNetwork = document.getElementById('depositNetwork');
  const depositPhone = document.getElementById('depositPhone');
  const ussdCode = document.getElementById('ussdCode');
  const executeUSSD = document.getElementById('executeUSSD');
  const transactionMessage = document.getElementById('transactionMessage');
  const depositProof = document.getElementById('depositProof');
  const previewImg = document.getElementById('previewImg');
  const depositSubmit = document.getElementById('depositSubmit');
  const depositStatus = document.getElementById('depositStatus');

  const withdrawAmount = document.getElementById('withdrawAmount');
  const withdrawNetwork = document.getElementById('withdrawNetwork');
  const withdrawPhone = document.getElementById('withdrawPhone');
  const withdrawMessage = document.getElementById('withdrawMessage');
  const withdrawSubmit = document.getElementById('withdrawSubmit');
  const withdrawStatus = document.getElementById('withdrawStatus');

  const balanceDisplay = document.getElementById('balanceDisplay');
  const userEmailDisplay = document.getElementById('userEmailDisplay');

  // Packs data
  const packs = [
    { name: 'Pack Bronze', min: 2000, max: 5000, gain: 250 },
    { name: 'Pack Silver', min: 5000, max: 10000, gain: 900 },
    { name: 'Pack Gold', min: 10000, max: 50000, gain: 2000 },
    { name: 'Pack Diamond', min: 50000, max: 1500000, gain: 12000 }
  ];
  packs.forEach(p=>{
    const d=document.createElement('div'); d.className='pack';
    d.innerHTML=`<h4>${p.name}</h4><div class="small-muted">Invest: ${p.min.toLocaleString()} - ${p.max.toLocaleString()} FCFA</div><div class="small-muted">Gains/12h: ${p.gain.toLocaleString()} FCFA</div>`;
    d.onclick=()=>{ depositPack.value=p.name; depositAmount.value=p.min; updateUSSD(); checkDepositEnable(); };
    packsContainer.appendChild(d);
  });

  // Tab switching
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> {
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.section').forEach(s=>s.classList.add('hidden'));
      document.getElementById(t.dataset.target).classList.remove('hidden');
    });
  });

  // Auth state
  let currentUserEmail = null;
  onAuthStateChanged(auth, user=>{
    if(user && user.email){
      currentUserEmail = user.email;
      userEmailDisplay.textContent = currentUserEmail;
      loadBalance();
    } else {
      // rediriger vers login si tu veux forcer l'auth
      // window.location.href = "index.html";
      // pour tests, on peut mettre un email de test mais tu as demandé auth : ici on arrête
      alert("Vous devez être connecté(e). Redirection vers la page de connexion.");
      window.location.href = "index.html";
    }
  });

  // Load balance from Firestore
  async function loadBalance(){
    if(!currentUserEmail) return;
    const ref = doc(db, 'users', currentUserEmail);
    const snap = await getDoc(ref);
    if(snap.exists()){
      balanceDisplay.textContent = (snap.data().balance || 0).toLocaleString() + " FCFA";
    } else {
      await setDoc(ref, { balance: 0, history: [] });
      balanceDisplay.textContent = "0 FCFA";
    }
  }

  // USSD generator
  function makeUSSD(network, amount){
    if(!network || !amount) return '';
    switch(network.toLowerCase()){
      case 'mtn': return `*880*41*177125*${amount}#`;
      case 'celtiis': return `*889*6*1*ESS02*${amount}#`;
      case 'moov': return `*851*4*1*264081*${amount}#`;
      default: return '';
    }
  }
  function updateUSSD(){
    const n = depositNetwork.value;
    const a = parseInt(depositAmount.value) || 0;
    const p = depositPhone.value.trim();
    const code = makeUSSD(n, a);
    ussdCode.value = (code && p) ? code : (code ? code : '');
    executeUSSD.style.display = code ? 'block' : 'none';
  }
  ['depositNetwork','depositAmount','depositPhone'].forEach(id=>{
    document.getElementById(id).addEventListener('input', updateUSSD);
  });

  // Execute USSD (open dialer) - encode # as %23
  executeUSSD.addEventListener('click', ()=>{
    const code = ussdCode.value.trim();
    if(!code) return alert("USSD non disponible");
    const tel = 'tel:' + encodeURIComponent(code.replace('#','%23'));
    // ouvrir le dialer si mobile
    window.location.href = tel;
  });

  // Preview image + convert on demand
  let lastProofBase64 = '';
  depositProof.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) { previewImg.style.display='none'; lastProofBase64=''; checkDepositEnable(); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      previewImg.src = ev.target.result;
      previewImg.style.display = 'block';
      lastProofBase64 = ev.target.result;
      checkDepositEnable();
    };
    reader.readAsDataURL(file);
  });

  // Enable deposit submit only if phone, message, proof present and ussd generated
  function checkDepositEnable(){
    const phoneOk = depositPhone.value.trim().length >= 6;
    const msgOk = transactionMessage.value.trim().length > 0;
    const proofOk = lastProofBase64 !== '';
    const ussdOk = ussdCode.value.trim().length > 0;
    depositSubmit.disabled = !(phoneOk && msgOk && proofOk && ussdOk);
  }
  ['depositPhone','transactionMessage'].forEach(id=>document.getElementById(id).addEventListener('input',checkDepositEnable));

  // Deposit submit
  depositSubmit.addEventListener('click', async ()=>{
    depositStatus.textContent = "Envoi en cours...";
    const amount = parseInt(depositAmount.value);
    const method = depositNetwork.value;
    const phone = depositPhone.value.trim();
    const message = transactionMessage.value.trim();
    const proof = lastProofBase64;

    if(!amount || !method || !phone || !message || !proof){
      alert("Tous les champs obligatoires doivent être remplis.");
      depositStatus.textContent = "";
      return;
    }

    // Update Firestore first (atomic simple)
    try {
      const userRef = doc(db, 'users', currentUserEmail);
      const snap = await getDoc(userRef);
      let balance = 0; let history = [];
      if(snap.exists()){
        balance = snap.data().balance || 0;
        history = snap.data().history || [];
      }
      balance += amount;
      const entry = {
        type: 'Dépôt',
        amount,
        method,
        phone,
        message,
        proof,
        date: new Date().toLocaleString()
      };
      history.unshift(entry);
      await setDoc(userRef, { balance, history }, { merge: true });
      balanceDisplay.textContent = balance.toLocaleString() + " FCFA";
    } catch(err){
      console.error("Erreur Firestore:", err);
      alert("Erreur lors de la mise à jour du solde.");
      depositStatus.textContent = "";
      return;
    }

    // Prepare and send email via EmailJS (sendForm technique)
    try {
      // create hidden form
      const form = document.createElement('form');
      form.style.display='none';
      form.innerHTML = `
        <input type="hidden" name="name" value="Mikoseel">
        <input type="hidden" name="user_name" value="${escapeHtml(currentUserEmail.split('@')[0])}">
        <input type="hidden" name="user_email" value="${escapeHtml(currentUserEmail)}">
        <input type="hidden" name="type" value="Dépôt">
        <input type="hidden" name="amount" value="${amount}">
        <input type="hidden" name="method" value="${escapeHtml(method)}">
        <input type="hidden" name="message" value="${escapeHtml(message)}">
        <input type="hidden" name="proof" value="${escapeHtml(proof)}">
        <input type="hidden" name="title" value="Nouvelle opération Mikoseel">
        <input type="hidden" name="email" value="${escapeHtml(currentUserEmail)}">
      `;
      document.body.appendChild(form);
      // send with your service/template
      await emailjs.sendForm('service_typd4jv', 'template_khilsn7', form);
      document.body.removeChild(form);
      depositStatus.textContent = "Email envoyé ✅";
      alert("Dépôt validé, email envoyé et solde mis à jour.");
      // reset UI
      document.getElementById('depositForm').reset?.(); // optional: if using form element; here we manually reset fields:
      depositPack.value = '';
      depositAmount.value = '';
      depositNetwork.value = '';
      depositPhone.value = '';
      ussdCode.value = '';
      transactionMessage.value = '';
      depositProof.value = '';
      previewImg.style.display='none';
      lastProofBase64='';
      checkDepositEnable();
    } catch(err){
      console.error("Erreur EmailJS:", err);
      depositStatus.textContent = "Erreur envoi email ❌";
      alert("Le dépôt a été enregistré dans Firestore mais l'envoi mail a échoué (voir console).");
    }
  });

  // Withdraw validation enable
  function checkWithdrawEnable(){
    const amt = parseInt(withdrawAmount.value) || 0;
    const method = withdrawNetwork.value;
    const phone = withdrawPhone.value.trim();
    const msg = withdrawMessage.value.trim();
    withdrawSubmit.disabled = !(amt>0 && method && phone.length>=6 && msg.length>0);
  }
  [withdrawAmount, withdrawNetwork, withdrawPhone, withdrawMessage].forEach(el=>el.addEventListener('input',checkWithdrawEnable));

  // Withdraw submit: check balance then update and send email
  withdrawSubmit.addEventListener('click', async ()=>{
    withdrawStatus.textContent = "Envoi en cours...";
    const amount = parseInt(withdrawAmount.value);
    const method = withdrawNetwork.value;
    const phone = withdrawPhone.value.trim();
    const message = withdrawMessage.value.trim();
    if(!amount || !method || !phone || !message){ alert("Tous les champs obligatoires"); withdrawStatus.textContent=''; return; }

    try {
      const userRef = doc(db, 'users', currentUserEmail);
      const snap = await getDoc(userRef);
      let balance = 0; let history = [];
      if(snap.exists()){
        balance = snap.data().balance || 0;
        history = snap.data().history || [];
      }
      if(balance < amount){ alert("Solde insuffisant"); withdrawStatus.textContent=''; return; }
      balance -= amount;
      const entry = { type: 'Retrait', amount, method, phone, message, date: new Date().toLocaleString() };
      history.unshift(entry);
      await setDoc(userRef, { balance, history }, { merge: true });
      balanceDisplay.textContent = balance.toLocaleString() + " FCFA";
    } catch(err){
      console.error("Erreur Firestore:", err);
      alert("Erreur lors de la mise à jour du solde.");
      withdrawStatus.textContent='';
      return;
    }

    // send email
    try {
      const form = document.createElement('form');
      form.style.display='none';
      form.innerHTML = `
        <input type="hidden" name="name" value="Mikoseel">
        <input type="hidden" name="user_name" value="${escapeHtml(currentUserEmail.split('@')[0])}">
        <input type="hidden" name="user_email" value="${escapeHtml(currentUserEmail)}">
        <input type="hidden" name="type" value="Retrait">
        <input type="hidden" name="amount" value="${amount}">
        <input type="hidden" name="method" value="${escapeHtml(method)}">
        <input type="hidden" name="message" value="${escapeHtml(message)}">
        <input type="hidden" name="proof" value="N/A">
        <input type="hidden" name="title" value="Nouvelle opération Mikoseel">
        <input type="hidden" name="email" value="${escapeHtml(currentUserEmail)}">
      `;
      document.body.appendChild(form);
      await emailjs.sendForm('service_typd4jv','template_khilsn7', form);
      document.body.removeChild(form);
      withdrawStatus.textContent = "Email envoyé ✅";
      alert("Retrait validé, email envoyé et solde mis à jour.");
      // reset fields
      withdrawAmount.value=''; withdrawNetwork.value=''; withdrawPhone.value=''; withdrawMessage.value='';
      checkWithdrawEnable();
    } catch(err){
      console.error("Erreur EmailJS retrait:", err);
      withdrawStatus.textContent = "Erreur envoi email ❌";
      alert("Retrait enregistré mais envoi email échoué (voir console).");
    }
  });

  // small helper to escape values inside hidden inputs
  function escapeHtml(str){
    if(!str) return '';
    return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  }
</script>
</body>
</html>
