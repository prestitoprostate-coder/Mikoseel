<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikoseel - Dashboard</title>
<style>
:root {
  --violet-dark: #0c001a;
  --violet: #4c1d95;
  --violet-mid: #6d28d9;
  --violet-light: #a855f7;
  --rose: #ec4899;
  --text-light: #e9d5ff;
  --card-bg: rgba(20,0,40,0.6);
  --card-shadow: rgba(236,72,153,0.3);
}
body {
  font-family:"Poppins",sans-serif;
  margin:0; padding:0;
  background: linear-gradient(120deg,var(--violet-dark),var(--violet),var(--violet-mid));
  background-size: 300% 300%;
  animation:moveBg 20s ease infinite;
  color: var(--text-light);
  overflow-x: hidden;
}
@keyframes moveBg{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
/* Bulles */
.bubbles{
  position:fixed; top:0; left:0; width:100%; height:100%;
  overflow:hidden; z-index:-1; pointer-events:none;
}
.bubble{
  position:absolute;
  bottom:-100px;
  background: radial-gradient(circle at 30% 30%, rgba(236,72,153,0.6), rgba(124,58,237,0.1));
  border-radius:50%;
  animation:rise linear infinite;
}
@keyframes rise{
  from{transform:translateY(0) scale(1); opacity:0.8;}
  to{transform:translateY(-120vh) scale(1.5); opacity:0;}
}
/* Header */
header{
  background: linear-gradient(90deg,var(--violet-mid),var(--rose));
  padding:12px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:22px;}
/* Container & Cards */
.container{
  padding:20px;
  max-width:1200px;
  margin:auto;
}
.card{
  background: var(--card-bg);
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 0 20px var(--card-shadow);
}
.card h2{margin-top:0;color:var(--violet-light);}
ul{list-style:none; padding:0;}
li{padding:6px 0; border-bottom:1px solid rgba(168,85,247,0.2);}
.machine-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px;}
.machine-card{
  padding:15px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 6px 15px rgba(0,0,0,0.5);
  cursor:pointer;
}
.machine-card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 25px rgba(236,72,153,0.5);
}
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<header>
  <h1>Mikoseel Dashboard</h1>
</header>

<div class="container">
  <div class="card">
    <h2>Solde</h2>
    <p id="balance">0 FCFA</p>
  </div>

  <div class="card">
    <h2>Historique des transactions</h2>
    <ul id="history"><li>Aucune transaction pour le moment</li></ul>
  </div>

  <div class="card">
    <h2>Machines</h2>
    <div class="machine-grid" id="machineCards"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

// Config Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
    authDomain: "valide-28624.firebaseapp.com",
    projectId: "valide-28624",
    storageBucket: "valide-28624.appspot.com",
    messagingSenderId: "483447990733",
    appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Récupérer l'email depuis l'URL
const urlParams = new URLSearchParams(window.location.search);
const userEmail = urlParams.get('email');

const balanceEl = document.getElementById('balance');
const historyEl = document.getElementById('history');
const machineCards = document.getElementById('machineCards');

if(userEmail){
  const userRef = doc(db, 'users', userEmail);
  
  // Mettre à jour le solde et historique en temps réel
  onSnapshot(userRef, snap=>{
    if(snap.exists()){
      const data = snap.data();
      balanceEl.textContent = (data.balance || 0).toLocaleString() + " FCFA";
      const hist = data.history || [];
      historyEl.innerHTML = hist.length ? hist.map(h=>{
        return `<li>${h.date} - ${h.type} ${h.pack ? '- '+h.pack : ''} ${h.gain ? '+ '+h.gain.toLocaleString()+' FCFA' : ''}</li>`;
      }).join('') : '<li>Aucune transaction pour le moment</li>';
    }else{
      balanceEl.textContent = "Utilisateur introuvable";
    }
  });

  // Machines
  const machines=[
    {name:"Pack Bronze",gain:250,colorHue:270},
    {name:"Pack Silver",gain:900,colorHue:280},
    {name:"Pack Gold",gain:2000,colorHue:290},
    {name:"Pack Diamond",gain:12000,colorHue:300}
  ];

  machines.forEach(m=>{
    const div=document.createElement("div");
    div.className="machine-card";
    div.style.background=`hsl(${m.colorHue},50%,20%)`;
    div.innerHTML=`<h3>${m.name}</h3><p>Gains/12h: ${m.gain.toLocaleString()} FCFA</p>`;
    div.addEventListener("click", async ()=>{
      await updateDoc(userRef,{
        history: arrayUnion({type:'Validation pack',pack:m.name,gain:m.gain,date:new Date().toLocaleString()}),
        balance: (snap.data().balance || 0) + m.gain
      });
      alert(`Pack ${m.name} validé !`);
    });
    machineCards.appendChild(div);
  });

}else{
  balanceEl.textContent = "Aucun utilisateur spécifié dans l'URL.";
}

// Bulles
function createBubbles(n=40){
  const container=document.getElementById('bubbles');
  for(let i=0;i<n;i++){
    const b=document.createElement('div');
    b.className='bubble';
    const size=10+Math.random()*50;
    b.style.width=b.style.height=size+'px';
    b.style.left=Math.random()*100+'%';
    const hue = 270 + Math.random()*30; 
    b.style.background=`radial-gradient(circle at 30% 30%, hsla(${hue},80%,70%,0.6), hsla(${hue},80%,50%,0.1))`;
    b.style.animationDuration=(5+Math.random()*15)+'s';
    b.style.animationDelay=(Math.random()*5)+'s';
    container.appendChild(b);
  }
}
createBubbles();
</script>
</body>
</html>
