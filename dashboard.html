<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Solde en temps réel</title>
<style>
body{font-family:sans-serif;background:#0c001a;color:#fff;padding:20px;}
h1{text-align:center;}
.card{background:rgba(20,0,40,0.8);padding:20px;border-radius:10px;margin:20px auto;max-width:400px;text-align:center;}
.balance{font-size:32px;color:#a855f7;margin-top:10px;}
</style>
</head>
<body>

<h1>Dashboard</h1>

<div class="card">
  <h2>Solde actuel</h2>
  <div class="balance" id="balance">0 FCFA</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
    authDomain: "valide-28624.firebaseapp.com",
    projectId: "valide-28624",
    storageBucket: "valide-28624.appspot.com",
    messagingSenderId: "483447990733",
    appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const balanceEl = document.getElementById('balance');
const userEmail = "smong2025@outlook.fr"; // Remplacer par l'utilisateur que tu veux suivre

const userRef = doc(db, 'users', userEmail);

// Écoute en temps réel pour le solde
onSnapshot(userRef, snap => {
    if(snap.exists()){
        const data = snap.data();
        balanceEl.textContent = (data.balance || 0).toLocaleString() + " FCFA";
    } else {
        balanceEl.textContent = "Utilisateur non trouvé";
    }
});
</script>

</body>
</html>
