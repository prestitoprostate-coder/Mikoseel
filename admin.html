<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mikosell Pro</title>
<style>
body { font-family: Arial,sans-serif; background:#0d0d1f; color:#fff; margin:0; padding:20px; }
h2 { color:#ff7f50; text-align:center; margin-bottom:20px; }
.container { max-width:900px; margin:0 auto; }
.section { margin-bottom:40px; }
.section h3 { border-bottom:2px solid #ff7f50; padding-bottom:5px; margin-bottom:20px; }
.card { background:#1a1a2f; border-radius:12px; padding:15px; margin-bottom:15px; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
.card p { margin:5px 0; }
button { padding:6px 12px; border:none; border-radius:8px; background:#ff7f50; color:#0d0d1f; cursor:pointer; font-weight:bold; margin-right:5px; margin-top:5px; }
button:hover { transform:scale(1.05); }
</style>
</head>
<body>

<h2>Admin - Mikosell Pro</h2>

<div class="container">
  <div class="section" id="depositSection">
    <h3>Dépôts en attente</h3>
  </div>
  <div class="section" id="withdrawSection">
    <h3>Retraits en attente</h3>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, get, update } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  databaseURL: "https://valide-28624-default-rtdb.firebaseio.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.appspot.com",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:ee5b850dc31cbb8776bc84"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentDeposits = [];
let currentWithdraws = [];

// Charger dépôts
function loadDeposits() {
    const depRef = ref(db, 'pendingDeposits');
    onValue(depRef, snapshot => {
        const deposits = [];
        snapshot.forEach(depSnap => deposits.push({...depSnap.val(), depositId: depSnap.key}));
        currentDeposits = deposits;
        renderDeposits(deposits);
    });
}

// Charger retraits
function loadWithdraws() {
    const wdrRef = ref(db, 'pendingWithdraws');
    onValue(wdrRef, snapshot => {
        const withdraws = [];
        snapshot.forEach(wdrSnap => withdraws.push({...wdrSnap.val(), withdrawId: wdrSnap.key}));
        currentWithdraws = withdraws;
        renderWithdraws(withdraws);
    });
}

// Rendu dépôts
function renderDeposits(deposits) {
    const section = document.getElementById('depositSection');
    section.innerHTML = '<h3>Dépôts en attente</h3>';
    deposits.forEach((d,i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <p><strong>Email:</strong> ${d.email}</p>
            <p><strong>Montant:</strong> ${d.amount}</p>
            <p><strong>Numéro:</strong> ${d.phone}</p>
            <p><strong>Réseau:</strong> ${d.network}</p>
            <p><strong>Date:</strong> ${d.date}</p>
            <p><strong>Message:</strong></p>
            <textarea readonly>${d.message}</textarea>
            <button onclick="approveDeposit(${i})">Approuver</button>
        `;
        section.appendChild(card);
    });
}

// Rendu retraits
function renderWithdraws(withdraws) {
    const section = document.getElementById('withdrawSection');
    section.innerHTML = '<h3>Retraits en attente</h3>';
    withdraws.forEach((w,i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <p><strong>Email:</strong> ${w.email}</p>
            <p><strong>Montant:</strong> ${w.amount}</p>
            <p><strong>Numéro:</strong> ${w.phone}</p>
            <p><strong>Date:</strong> ${w.date}</p>
            <button onclick="approveWithdraw(${i})">Approuver</button>
        `;
        section.appendChild(card);
    });
}

// Approuver dépôt
window.approveDeposit = async function(index) {
    const dep = currentDeposits[index];
    if(!dep) return;
    try{
        const userRef = ref(db, `users/${dep.uid}`);
        const userSnap = await get(userRef);
        const balance = userSnap.val()?.balance || 0;
        await update(userRef, {balance: balance + dep.amount});
        await remove(ref(db, `pendingDeposits/${dep.depositId}`));
        alert("Dépôt approuvé !");
    }catch(err){ alert("Erreur : "+err.message); }
}

// Approuver retrait
window.approveWithdraw = async function(index) {
    const wdr = currentWithdraws[index];
    if(!wdr) return;
    try{
        const userRef = ref(db, `users/${wdr.uid}`);
        const userSnap = await get(userRef);
        const balance = userSnap.val()?.balance || 0;
        if(balance < wdr.amount){ alert("Solde insuffisant !"); return; }
        await update(userRef, {balance: balance - wdr.amount});
        await remove(ref(db, `pendingWithdraws/${wdr.withdrawId}`));
        alert("Retrait approuvé !");
    }catch(err){ alert("Erreur : "+err.message); }
}

loadDeposits();
loadWithdraws();
</script>

</body>
</html>
