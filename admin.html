<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mikosell Pro</title>
<style>
body { font-family:'Poppins',sans-serif; background:#1a1a2e; color:#fff; padding:20px; }
h2 { color:#ffcc00; margin-bottom:20px; text-align:center; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { border:1px solid #fff; padding:10px; text-align:center; }
th { background:#162447; }
button { padding:5px 10px; border:none; border-radius:8px; background:#ffcc00; color:#1a1a2e; font-weight:bold; cursor:pointer; transition:0.3s; }
button:hover { background:#ff9900; }
.status-pending { color:#ffcc00; }
.status-approved { color:#00ff99; }
</style>
</head>
<body>

<h2>Demandes de Dépôt</h2>
<table id="depositsTable">
  <thead>
    <tr>
      <th>Utilisateur</th>
      <th>Montant</th>
      <th>Téléphone</th>
      <th>Réseau</th>
      <th>Message</th>
      <th>Date</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.firebasestorage.app",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:ee5b850dc31cbb8776bc84",
  measurementId: "G-BSZJ5PW639"
};
firebase.initializeApp(firebaseConfig);
const analytics = firebase.analytics();
const db = firebase.firestore();

const tableBody = document.querySelector("#depositsTable tbody");

// 🔴 Écoute en direct des dépôts
db.collection("deposits").orderBy("date", "desc")
.onSnapshot(snapshot => {
  tableBody.innerHTML = ""; // reset
  snapshot.forEach(doc => {
    const d = doc.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${d.userEmail}</td>
      <td>${d.amount.toLocaleString('fr-FR')} FCFA</td>
      <td>${d.phone}</td>
      <td>${d.network}</td>
      <td>${d.message}</td>
      <td>${d.date ? d.date.toDate().toLocaleString() : '-'}</td>
      <td class="status-${d.status}">${d.status}</td>
      <td>
        ${d.status === "pending" ? `<button onclick="approveDeposit('${doc.id}')">Approuver</button>` : '-'}
      </td>
    `;
    tableBody.appendChild(tr);
  });
});

// 🔹 Fonction pour approuver
function approveDeposit(id) {
  db.collection("deposits").doc(id).update({status: "approved"})
    .then(() => alert("Dépôt approuvé !"))
    .catch(err => console.error(err));
}
</script>

</body>
</html>
