<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ancienne version- Mikosell Pro</title>
<style>
body { font-family: Arial,sans-serif; background:#0d0d1f; color:#fff; margin:0; padding:20px; }
h2 { color:#ff7f50; text-align:center; margin-bottom:20px; }
.container { max-width:900px; margin:0 auto; }
.section { margin-bottom:40px; }
.section h3 { border-bottom:2px solid #ff7f50; padding-bottom:5px; margin-bottom:20px; }
.card { background:#1a1a2f; border-radius:12px; padding:15px; margin-bottom:15px; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
.card p { margin:5px 0; }
textarea { width:100%; height:60px; border-radius:8px; border:none; padding:5px; background:#12122a; color:#fff; resize:none; margin-bottom:5px; }
button { padding:6px 12px; border:none; border-radius:8px; background:#ff7f50; color:#0d0d1f; cursor:pointer; font-weight:bold; margin-right:5px; margin-top:5px; }
button:hover { transform:scale(1.05); }
.card-buttons { display:flex; justify-content:flex-start; flex-wrap:wrap; }
#loginDiv { max-width:400px; margin:50px auto; text-align:center; }
#loginDiv input { width:80%; padding:10px; margin:5px 0; border-radius:8px; border:none; background:#12122a; color:#fff; }
#loginDiv button { width:84%; margin-top:10px; }
#loginError { color:#ff4d4d; margin-top:10px; }
#adminDiv { display:none; }
</style>
</head>
<body>

<h2>Ancienne version obsolète - Mikosell Pro</h2>

<!-- Section Connexion -->
<div id="loginDiv">
  <input type="text" id="adminUser" placeholder="Utilisateur">
  <input type="password" id="adminPass" placeholder="Mot de passe">
  <button onclick="loginAdmin()">Se connecter</button>
  <div id="loginError"></div>
</div>

<!-- Section Admin -->
<div id="adminDiv" class="container">

  <div class="section" id="depositSection">
    <h3>Dépôts en attente</h3>
  </div>

  <div class="section" id="withdrawSection">
    <h3>Retraits en attente</h3>
  </div>

</div>

<!-- Firebase et Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getDatabase, ref, update, get, child } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

// Config Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  databaseURL: "https://valide-28624-default-rtdb.firebaseio.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.appspot.com",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:ee5b850dc31cbb8776bc84"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Déclarer la fonction de connexion globalement
window.loginAdmin = function(){
  const user = document.getElementById("adminUser").value;
  const pass = document.getElementById("adminPass").value;
  if(user==="Mikoseel" && pass==="Dada12da12"){
    document.getElementById("loginDiv").style.display="none";
    document.getElementById("adminDiv").style.display="block";
    renderDeposits();
    renderWithdraws();
  } else {
    document.getElementById("loginError").innerText="Identifiant ou mot de passe incorrect.";
  }
}

// Données locales (simulation)
let users = JSON.parse(localStorage.getItem('users')) || [];
let pendingDeposits = JSON.parse(localStorage.getItem('pendingDeposits')) || [];
let pendingWithdraws = JSON.parse(localStorage.getItem('pendingWithdraws')) || [];
let history = JSON.parse(localStorage.getItem('history')) || [];

const machines = [
  {name:"Bronze", min:2000, max:5000, gain12h:250},
  {name:"Silver", min:5001, max:20000, gain12h:900},
  {name:"Gold", min:20001, max:50000, gain12h:2000},
  {name:"Diamond", min:50001, max:100000, gain12h:12000}
];

// Copier le texte
function copyText(id){
  const textArea = document.getElementById(id);
  textArea.select();
  document.execCommand("copy");
  alert("Message copié !");
}

// Approuver un dépôt et mettre à jour Firebase
window.approveDeposit = function(index){
  const deposit = pendingDeposits[index];
  const user = users.find(u => u.email === deposit.email);
  if(!user) return;

  const machine = machines.find(m => deposit.amount >= m.min && deposit.amount <= m.max);
  if(!machine){
    alert("Montant hors plage des machines disponibles !");
    return;
  }

  user.balance = (user.balance || 0) + deposit.amount;

  history.push({
    email: user.email,
    date: new Date().toLocaleString(),
    type: 'Dépôt',
    amount: deposit.amount,
    gain: machine.gain12h,
    machine: machine.name,
    message: deposit.message
  });

  // Mise à jour Firebase
  update(ref(db, 'users/' + user.email.replace('.',',')), { balance: user.balance })
    .then(() => console.log("Balance mise à jour dans Firebase"));

  pendingDeposits.splice(index,1);

  localStorage.setItem('history', JSON.stringify(history));
  localStorage.setItem('users', JSON.stringify(users));
  localStorage.setItem('pendingDeposits', JSON.stringify(pendingDeposits));

  renderDeposits();
}

// Approuver un retrait
window.approveWithdraw = function(index){
  const withdraw = pendingWithdraws[index];
  const user = users.find(u => u.email === withdraw.email);
  if(user && user.balance >= withdraw.amount){
    user.balance -= withdraw.amount;

    history.push({
      email: user.email,
      date: new Date().toLocaleString(),
      type: 'Retrait',
      amount: withdraw.amount,
      gain: 0,
      message: withdraw.message || ""
    });

    pendingWithdraws.splice(index,1);

    localStorage.setItem('history', JSON.stringify(history));
    localStorage.setItem('users', JSON.stringify(users));
    localStorage.setItem('pendingWithdraws', JSON.stringify(pendingWithdraws));

    renderWithdraws();
  } else {
    alert("Solde insuffisant pour ce retrait !");
  }
}

// Afficher les dépôts
function renderDeposits(){
  const section = document.getElementById('depositSection');
  section.innerHTML = '<h3>Dépôts en attente</h3>';
  if(pendingDeposits.length === 0){
    section.innerHTML += "<p>Aucune demande de dépôt en attente.</p>";
  }
  pendingDeposits.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <p><strong>Utilisateur:</strong> ${d.email}</p>
      <p><strong>Montant:</strong> ${d.amount}</p>
      <p><strong>Numéro:</strong> ${d.phone}</p>
      <p><strong>Réseau:</strong> ${d.network}</p>
      <p><strong>Date:</strong> ${d.date}</p>
      <p><strong>Message:</strong></p>
      <textarea readonly id="depMsg${i}">${d.message}</textarea>
      <div class="card-buttons">
        <button onclick="copyText('depMsg${i}')">Copier</button>
        <button onclick="approveDeposit(${i})">Approuver</button>
      </div>
    `;
    section.appendChild(card);
  });
}

// Afficher les retraits
function renderWithdraws(){
  const section = document.getElementById('withdrawSection');
  section.innerHTML = '<h3>Retraits en attente</h3>';
  if(pendingWithdraws.length === 0){
    section.innerHTML += "<p>Aucune demande de retrait en attente.</p>";
  }
  pendingWithdraws.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <p><strong>Utilisateur:</strong> ${w.email}</p>
      <p><strong>Montant:</strong> ${w.amount}</p>
      <p><strong>Numéro:</strong> ${w.phone}</p>
      <p><strong>Date:</strong> ${w.date}</p>
      <p><strong>Message:</strong></p>
      <textarea readonly id="retMsg${i}">${w.message || ''}</textarea>
      <div class="card-buttons">
        <button onclick="copyText('retMsg${i}')">Copier</button>
        <button onclick="approveWithdraw(${i})">Approuver</button>
      </div>
    `;
    section.appendChild(card);
  });
}

</script>
</body>
</html>
