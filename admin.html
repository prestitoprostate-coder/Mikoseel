<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mikosell Pro</title>
<style>
body { font-family:'Poppins',sans-serif; background:#1a1a2e; color:#fff; padding:20px; }
h2 { color:#ffcc00; margin-bottom:20px; }
.deposit { background: rgba(255,204,0,0.1); padding:15px; margin-bottom:10px; border-radius:10px; }
.pending { color:#ff9900; }
.approved { color:#00ff99; }
button { padding:5px 10px; margin-top:10px; border:none; border-radius:5px; cursor:pointer; background:#ffcc00; color:#1a1a2e; }
button:hover { background:#ff9900; }
</style>
</head>
<body>
<h2>Demandes de Dépôt</h2>
<div id="depositsList"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
  authDomain: "valide-28624.firebaseapp.com",
  projectId: "valide-28624",
  storageBucket: "valide-28624.firebasestorage.app",
  messagingSenderId: "483447990733",
  appId: "1:483447990733:web:ee5b850dc31cbb8776bc84",
  measurementId: "G-BSZJ5PW639"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const depositsList = document.getElementById('depositsList');

function loadDeposits() {
  db.collection("deposits").orderBy("date", "desc").onSnapshot(snapshot => {
    depositsList.innerHTML = '';
    snapshot.forEach(doc => {
      const d = doc.data();
      const div = document.createElement('div');
      div.className = 'deposit';
      div.innerHTML = `
        <strong>Utilisateur:</strong> ${d.userEmail}<br>
        <strong>Montant:</strong> ${d.amount} FCFA<br>
        <strong>Téléphone:</strong> ${d.phone}<br>
        <strong>Réseau:</strong> ${d.network}<br>
        <strong>Message:</strong> ${d.message}<br>
        <strong>Status:</strong> <span class="${d.status}">${d.status}</span><br>
        <button onclick="approveDeposit('${doc.id}')">Approuver</button>
      `;
      depositsList.appendChild(div);
    });
  });
}

function approveDeposit(id) {
  db.collection("deposits").doc(id).update({status: "approved"})
    .then(() => alert("Dépôt approuvé !"))
    .catch(err => console.error(err));
}

loadDeposits();
</script>
</body>
</html>
