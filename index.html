<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mikoseel — Connexion</title>
<style>
:root{
  --violet-dark:#0c001a;
  --violet:#4c1d95;
  --violet-mid:#6d28d9;
  --violet-light:#a855f7;
  --rose:#ec4899;
  --text-light:#e9d5ff;
  --danger:#f87171;
  font-family:"Poppins",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(120deg,var(--violet-dark),var(--violet),var(--violet-mid));
  background-size:300% 300%;
  animation:moveBg 15s ease infinite;
  color:var(--text-light);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}
@keyframes moveBg{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
header{
  width:100%;
  background:linear-gradient(90deg,var(--violet-mid),var(--rose));
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 24px;
  box-shadow:0 3px 15px rgba(0,0,0,0.2);
  position:sticky;
  top:0;
  z-index:100;
}
header .logo{
  font-size:28px;
  font-weight:700;
  color:#fff;
}
/* bulles */
.bubbles{
  position:fixed;top:0;left:0;width:100%;height:100%;
  overflow:hidden;z-index:-1;pointer-events:none;
}
.bubble{
  position:absolute;
  bottom:-100px;
  background:radial-gradient(circle at 30% 30%,rgba(236,72,153,0.6),rgba(124,58,237,0.1));
  border-radius:50%;
  animation:rise linear infinite;
}
@keyframes rise{
  from{transform:translateY(0) scale(1);opacity:0.8;}
  to{transform:translateY(-110vh) scale(1.5);opacity:0;}
}
.wrap{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:60px 20px;
}
.panel{
  background:rgba(20,0,40,0.6);
  border-radius:16px;
  padding:32px;
  box-shadow:0 0 25px rgba(168,85,247,0.3);
  width:400px;
}
.panel h1{color:var(--violet-light); text-align:center; margin-bottom:20px;}
form{display:flex;flex-direction:column;gap:14px;}
input{
  padding:12px;border-radius:10px;
  border:1px solid rgba(168,85,247,0.4);
  background:rgba(76,29,149,0.4);
  color:var(--text-light);
  outline:none;transition:0.3s;
}
input:focus{
  border-color:var(--rose);
  background:rgba(236,72,153,0.2);
}
button.primary{
  background:linear-gradient(90deg,var(--violet-mid),var(--rose));
  color:#fff;border:none;padding:12px;border-radius:10px;
  font-weight:600;cursor:pointer;transition:0.3s;
}
button.primary:hover{
  transform:scale(1.03);
  box-shadow:0 0 25px rgba(236,72,153,0.6);
}
.error{color:var(--danger);font-weight:600;text-align:center;}
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<header>
  <div class="logo">Mikoseel</div>
</header>

<div class="wrap">
  <div class="panel">
    <h1>Connexion</h1>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Mot de passe" required />
      <button type="submit" class="primary">Se connecter</button>
    </form>
    <div id="errorMsg" class="error"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

// Config Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
    authDomain: "valide-28624.firebaseapp.com",
    projectId: "valide-28624",
    storageBucket: "valide-28624.appspot.com",
    messagingSenderId: "483447990733",
    appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginForm = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');

loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    // Connexion réussie, redirection vers le dashboard avec email
    window.location.href = `dashboard.html?email=${encodeURIComponent(email)}`;
  } catch(error) {
    errorMsg.textContent = "Email ou mot de passe incorrect.";
    console.error(error);
  }
});

// Bulles
function createBubbles(n=25){
  const container=document.getElementById('bubbles');
  for(let i=0;i<n;i++){
    const b=document.createElement('div');
    b.className='bubble';
    const size=20+Math.random()*60;
    b.style.width=b.style.height=size+'px';
    b.style.left=Math.random()*100+'%';
    b.style.animationDuration=(8+Math.random()*10)+'s';
    b.style.animationDelay=(Math.random()*5)+'s';
    container.appendChild(b);
  }
}
createBubbles();
</script>

</body>
</html>
