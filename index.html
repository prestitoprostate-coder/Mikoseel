<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mikoseel — Connexion</title>
<style>
:root{
  --violet-dark:#0c001a;
  --violet:#4c1d95;
  --violet-mid:#6d28d9;
  --violet-light:#a855f7;
  --rose:#ec4899;
  --text-light:#e9d5ff;
  --danger:#f87171;
  font-family:"Poppins",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:linear-gradient(120deg,var(--violet-dark),var(--violet),var(--violet-mid));
  background-size:300% 300%;
  animation:moveBg 15s ease infinite;
  color:var(--text-light);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}
@keyframes moveBg{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.wrap{display:flex;justify-content:center;align-items:flex-start;gap:30px;flex-wrap:wrap;padding:40px 20px;}
.panel{background:rgba(20,0,40,0.6);border:1px solid rgba(168,85,247,0.3);border-radius:16px;padding:32px;box-shadow:0 0 25px rgba(168,85,247,0.3);backdrop-filter:blur(6px);width:420px;}
h1{font-size:24px;color:var(--violet-light);margin:0;}
form{margin-top:20px;display:flex;flex-direction:column;gap:14px;}
input{padding:12px;border-radius:10px;border:1px solid rgba(168,85,247,0.4);background:rgba(76,29,149,0.4);color:var(--text-light);outline:none;transition:0.3s;}
input:focus{border-color:var(--rose);background:rgba(236,72,153,0.2);}
button.primary{background:linear-gradient(90deg,var(--violet-mid),var(--rose));color:#fff;border:none;padding:12px;border-radius:10px;font-weight:600;cursor:pointer;transition:0.3s;}
button.primary:hover{transform:scale(1.03);}
.error{color:var(--danger);font-weight:600;}
.muted{font-size:13px;color:#c4b5fd;text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Connexion</h1>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Adresse email" required />
      <input type="password" id="password" placeholder="Mot de passe" required />
      <button type="submit" class="primary">Se connecter</button>
    </form>
    <div id="msg" class="muted"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

// Config Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBKyAIcBC8tpWWaYgE_NeZEWJn8AEoyDLQ",
    authDomain: "valide-28624.firebaseapp.com",
    projectId: "valide-28624",
    storageBucket: "valide-28624.appspot.com",
    messagingSenderId: "483447990733",
    appId: "1:483447990733:web:25c76bde60f9d78e76bc84"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const loginForm = document.getElementById('loginForm');
const msgEl = document.getElementById('msg');

loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();

  if(!email || !password) return;

  const userRef = doc(db, 'users', email);
  const snap = await getDoc(userRef);
  if(!snap.exists()){
    msgEl.textContent = "Utilisateur non trouvé";
    msgEl.classList.add('error');
    return;
  }

  const data = snap.data();
  if(data.password !== password){
    msgEl.textContent = "Mot de passe incorrect";
    msgEl.classList.add('error');
    return;
  }

  // Connexion réussie : stocker email pour Dashboard
  sessionStorage.setItem('loggedEmail', email);
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
